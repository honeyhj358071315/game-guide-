<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参与投票</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a202c;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background: #2d3748;
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #a0aec0;
            margin-bottom: 30px;
        }

        /* 选项容器 - 横向换行 */
        #optionsContainer,
        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        /* 每个选项块 */
        .option {
            flex: 1 0 calc(25% - 12px);
            /* 每行最多4个，可根据需要调整百分比 */
            min-width: 120px;
            max-width: 200px;
            padding: 15px;
            border: none;
            border-radius: 0;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-sizing: border-box;
            background: transparent;
            display: flex;
            align-items: center;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .option.selected {
            background: rgba(255, 255, 255, 0.05);
        }

        .option-index {
            font-weight: bold;
            color: #a0aec0;
            margin-bottom: 5px;
        }

        .option-text {
            word-break: break-word;
            color: white;
        }

        /* 竖向布局（选项≤10个时） */
        #optionsContainer.vertical-layout {
            display: block; /* 改为块状堆叠 */
            flex-wrap: nowrap;
            gap: 0; /* 移除横向间距 */
        }
        #optionsContainer.vertical-layout .option {
            flex: none; /* 清除弹性属性 */
            min-width: auto;
            max-width: 100%;
            width: 100%;
            margin-bottom: 12px; /* 添加纵向间距 */
            padding: 18px 20px;
            border-radius: 12px;
            border: 2px solid #4a5568;
        }
        #optionsContainer.vertical-layout .option:hover {
            border-color: #4299e1;
        }

        /* 横向堆叠布局（选项>10个时） */
        #optionsContainer.horizontal-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        #optionsContainer.horizontal-layout .option {
            flex: 1 0 calc(25% - 12px);
            min-width: 120px;
            max-width: 200px;
            padding: 15px;
            border-radius: 0;
            border: none;
        }

        /* 多选模式下的复选框 */
        .checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            border: 2px solid #a0aec0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            background: transparent;
        }

        .option.selected .checkbox {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
        }

        .checkbox::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
        }

        .option.selected .checkbox::after {
            opacity: 1;
        }

        .option-text {
            flex-grow: 1;
            font-size: 1rem;
            font-weight: 400;
            color: white;
        }

        /* 操作按钮 */
        .actions {
            margin-top: 30px;
            text-align: center;
        }

        .btn {
            padding: 14px 28px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(66, 153, 225, 0.3);
        }

        .btn:disabled {
            background: #4a5568;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 结果面板 */
        .results {
            margin-top: 40px;
            background: #2d3748;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #4a5568;
            display: none;
            color: white;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results h3 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .chart-item {
            margin: 15px 0;
        }

        .bar-container {
            display: flex;
            align-items: center;
        }

        .bar-label {
            width: 120px;
            font-weight: 500;
        }

        .bar-wrapper {
            flex-grow: 1;
            height: 28px;
            background: #e2e8f0;
            border-radius: 8px;
            margin: 0 15px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: linear-gradient(90deg, #4299e1, #38b2ac);
            border-radius: 8px 0 0 8px;
            width: 0%;
            transition: width 1s ease-out;
        }

        .bar-count {
            width: 80px;
            text-align: right;
            font-weight: bold;
        }

        /* 提示信息 */
        .info {
            text-align: center;
            margin-top: 20px;
            color: #a0aec0;
            font-size: 0.9rem;
        }

        .multi-hint {
            color: #fc8181;
            font-weight: 500;
            margin-top: 10px;
        }

        .alert {
            padding: 15px;
            background: #2d3748;
            border: 1px solid #742a2a;
            border-radius: 10px;
            color: #feb2b2;
            margin: 15px 0;
            display: none;
        }

        .alert.success {
            background: #2d3748;
            border: 1px solid #2a7435;
            color: #b2feb2;
        }

        .alert.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="pollTitle">加载中...</h1>
        <p class="subtitle" id="pollSubtitle">请选择您支持的选项</p>

        <div id="votingRules"
            style="background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 15px; margin: 15px 0; display: none;">
            <h4 style="color: #a0aec0; margin-bottom: 10px; font-size: 1rem;">📋 投票规则与注意事项</h4>
            <div id="rulesContent"
                style="color: #a0aec0; line-height: 1.5; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap;">
            </div>
        </div>

        <div class="alert" id="alertBox"></div>

        <div id="optionsContainer">
            <div class="option">
                <div class="checkbox"></div>
                <div class="option-text">正在加载选项...</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn" id="submitVoteBtn" disabled>提交投票</button>
        </div>

        <div class="info">
            <div id="multiHint" class="multi-hint" style="display:none;">💡 此投票允许多选，可同时选择多个选项</div>
            <div>系统将根据设备标识确保投票公正</div>
        </div>

        <div class="results" id="resultsPanel">
            <h3>📊 投票结果</h3>
            <div id="resultsChart"></div>
            <!-- 🔽 新增分享按钮 -->
            <div style="margin-top: 25px; text-align: center; padding-top: 20px; border-top: 1px solid #4a5568;">
                <button id="shareBtn" class="btn" style="background: #48bb78;">
                    📋 复制投票链接
                </button>
                <p id="shareHint" style="color: #a0aec0; margin-top: 10px; font-size: 0.9rem; display: none;">
                    链接已复制，可粘贴分享给好友
                </p>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const urlParams = new URLSearchParams(window.location.search);
        const pollId = urlParams.get('id');
        const apiBase = 'https://vote-api.whmx.top/api';
        let userId = localStorage.getItem(`vote_user_${pollId}`) ||
            'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem(`vote_user_${pollId}`, userId);

        let pollConfig = { allow_multiple: false };
        let selectedOptions = new Set(); // 用于存储多选选项
        let optionsArray = []; // 全局存储选项数组，用于结果显示

        // 1. 加载投票信息
        async function loadPoll() {
            try {
                const resp = await fetch(`${apiBase}/poll/${pollId}`);
                const data = await resp.json();

                // 添加调试信息，查看API返回的完整数据结构
                console.log('API返回的完整数据:', data);
                console.log('是否有rules字段:', 'rules' in data.data);
                console.log('rules字段的值:', data.data.rules);

                if (data.success) {
                    document.getElementById('pollTitle').textContent = data.data.title;

                    // 🔧 关键修改：正确处理 config 字段
                    // data.data.config 可能是字符串，也可能是对象
                    let configStr = data.data.config;
                    if (typeof configStr === 'string') {
                        pollConfig = JSON.parse(configStr || '{}');
                    } else {
                        pollConfig = configStr || {};
                    }

                    // options 字段已经是数组了，直接使用
                    optionsArray = data.data.options;

                    // 显示投票规则（仅从API返回的 data.data.rules 字段读取）
                    if (data.data.rules && data.data.rules.trim() !== '') {
                        document.getElementById('rulesContent').textContent = data.data.rules;
                        document.getElementById('votingRules').style.display = 'block';
                    }
                    // 添加默认示例规则（仅用于测试，实际使用时可以删除）
                    // 这行代码可以帮助我们验证显示效果
                    else {
                        // 仅用于测试，实际环境中可以删除
                        // document.getElementById('rulesContent').textContent = '示例规则：每人只能投一票；投票截止时间为12月31日；禁止刷票。';
                        // document.getElementById('votingRules').style.display = 'block';
                    }

                    // 显示多选提示
                    if (pollConfig.allow_multiple) {
                        document.getElementById('multiHint').style.display = 'block';
                        document.getElementById('pollSubtitle').textContent = '可多选，点击选项进行选择';
                    }

                    renderOptions(optionsArray);
                } else {
                    showAlert(data.error || '投票不存在');
                }
            } catch (error) {
                console.error('加载失败:', error);
                showAlert('加载失败：' + error.message);
            }
        }

        // 2. 渲染选项（支持多选/单选）
        function renderOptions(options) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            // 根据选项数量决定布局样式
            if (options.length <= 10) {
                container.classList.add('vertical-layout');   // 竖排
                container.classList.remove('horizontal-layout');
            } else {
                container.classList.add('horizontal-layout');  // 横排堆叠
                container.classList.remove('vertical-layout');
            }

            // 渲染选项
            options.forEach((text, index) => {
                const optionNum = index + 1;
                const div = document.createElement('div');
                div.className = 'option';
                div.dataset.option = optionNum;
                div.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="option-text">${optionNum}. ${text}</div>
                `;

                // 点击事件
                div.onclick = () => toggleOption(optionNum, div);
                container.appendChild(div);
            });

            // 启用提交按钮
            document.getElementById('submitVoteBtn').disabled = false;
        }

        // 3. 切换选项选择
        function toggleOption(optionNum, element) {
            if (pollConfig.allow_multiple) {
                // 多选模式：切换选择状态
                if (selectedOptions.has(optionNum)) {
                    selectedOptions.delete(optionNum);
                    element.classList.remove('selected');
                } else {
                    selectedOptions.add(optionNum);
                    element.classList.add('selected');
                }
            } else {
                // 单选模式：只选一个
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                element.classList.add('selected');
                selectedOptions.clear();
                selectedOptions.add(optionNum);
            }

            // 更新按钮状态
            updateSubmitButton();
        }

        // 4. 更新提交按钮状态
        function updateSubmitButton() {
            const btn = document.getElementById('submitVoteBtn');
            btn.disabled = selectedOptions.size === 0;
            btn.textContent = selectedOptions.size > 1 ?
                `提交投票 (${selectedOptions.size}个选项)` : '提交投票';
        }

        // 5. 提交投票
        async function submitVote() {
            const btn = document.getElementById('submitVoteBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                // 准备提交数据（单数或数组）
                const voteData = {
                    poll_id: parseInt(pollId),
                    user_id: userId,
                    option: pollConfig.allow_multiple ?
                        Array.from(selectedOptions) : Array.from(selectedOptions)[0]
                };

                const resp = await fetch(`${apiBase}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(voteData)
                });

                const result = await resp.json();

                if (result.success) {
                    showAlert('✅ ' + result.message, 'success');
                    // 禁用所有选项
                    document.querySelectorAll('.option').forEach(opt => {
                        opt.style.opacity = '0.6';
                        opt.style.cursor = 'not-allowed';
                        opt.onclick = null;
                    });
                    // 显示结果
                    loadResults();
                } else {
                    showAlert('❌ ' + (result.message || '投票失败'));
                    btn.disabled = false;
                    updateSubmitButton();
                }
            } catch (error) {
                console.error('提交失败:', error);
                showAlert('网络错误，请稍后重试');
                btn.disabled = false;
                updateSubmitButton();
            }
        }

        // 6. 加载结果
        async function loadResults() {
            try {
                const resp = await fetch(`${apiBase}/results?poll_id=${pollId}`);
                const data = await resp.json();

                if (data.success && data.data.length > 0) {
                    renderChart(data.data);
                    document.getElementById('resultsPanel').classList.add('show');
                }
            } catch (error) {
                console.error('加载结果失败:', error);
            }
        }

        // 7. 渲染图表
        function renderChart(data) {
            const container = document.getElementById('resultsChart');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: #a0aec0;">暂无投票数据</p>';
                return;
            }

            // 按选项序号排序
            data.sort((a, b) => a.option - b.option);
            const totalVotes = data.reduce((sum, item) => sum + item.count, 0);

            // 生成堆叠条形图
            container.innerHTML = `
                <div class="stacked-bar" style="height: 40px; background: #4a5568; border-radius: 8px; margin: 25px 0; overflow: hidden; display: flex;">
                    ${data.map(item => {
                const widthPercent = totalVotes > 0 ? (item.count / totalVotes * 100) : 0;
                // 使用不同颜色区分
                const hue = (item.option * 60) % 360;
                // 获取选项名称，如果不存在则显示选项编号
                const optionName = optionsArray[item.option - 1] || `选项${item.option}`;
                return `<div title="${optionName}: ${item.count}票 (${Math.round(widthPercent)}%)"
                                    style="width: ${widthPercent}%; background: hsl(${hue}, 70%, 60%); transition: width 1s ease-out;"></div>`;
            }).join('')}
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 15px; font-size: 0.9em;">
                    ${data.map(item => {
                const percent = totalVotes > 0 ? Math.round((item.count / totalVotes) * 100) : 0;
                const hue = (item.option * 60) % 360;
                // 获取选项名称，如果不存在则显示选项编号
                const optionName = optionsArray[item.option - 1] || `选项${item.option}`;
                return `<div style="display: flex; align-items: center;">
                                    <span style="display: inline-block; width: 12px; height: 12px; background: hsl(${hue}, 80%, 65%); margin-right: 8px;"></span>
                                    <span>${optionName}: ${item.count}票 (${percent}%)</span>
                                </div>`;
            }).join('')}
                </div>
            `;
        }

        // 8. 显示提示
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert ${type === 'success' ? 'success' : ''} show`;
            setTimeout(() => alertBox.classList.remove('show'), 5000);
        }

        // 分享功能：复制当前投票链接
        function setupShareButton() {
            const shareBtn = document.getElementById('shareBtn');
            const hint = document.getElementById('shareHint');
            
            if (!shareBtn) return;
            
            shareBtn.onclick = async () => {
                const voteLink = window.location.href; // 获取当前页面完整链接
                
                try {
                    // 使用现代剪贴板API
                    await navigator.clipboard.writeText(voteLink);
                    // 提示用户
                    hint.style.display = 'block';
                    hint.style.color = '#48bb78';
                    hint.textContent = '✅ 投票链接已复制到剪贴板！';
                    shareBtn.textContent = '✅ 已复制';
                    shareBtn.style.background = '#38a169';
                    
                    // 3秒后恢复按钮状态
                    setTimeout(() => {
                        hint.style.display = 'none';
                        shareBtn.textContent = '📋 复制投票链接';
                        shareBtn.style.background = '#48bb78';
                    }, 3000);
                } catch (err) {
                    // 降级方案：使用老式 document.execCommand
                    const input = document.createElement('input');
                    input.value = voteLink;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    
                    // 提示用户
                    hint.style.display = 'block';
                    hint.style.color = '#ecc94b';
                    hint.textContent = '✅ 链接已复制（兼容模式）';
                    setTimeout(() => hint.style.display = 'none', 3000);
                }
            };
        }

        // 9. 初始化
        if (!pollId) {
            showAlert('无效的投票链接');
        } else {
            loadPoll();
            // 绑定提交按钮
            document.getElementById('submitVoteBtn').onclick = submitVote;
            // 设置分享按钮
            setupShareButton(); // 🔽 新增这一行
            // 首次加载结果（如果已投过票）
            setTimeout(loadResults, 1000);
        }
    </script>
</body>

</html>
