<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参与投票 - 简易投票系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
        }
        h1 {
            color: #1a202c;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.4rem;
            font-weight: 800;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        .options-container {
            margin: 30px 0;
        }
        .option {
            padding: 22px 24px;
            margin: 16px 0;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            background: white;
        }
        .option:hover {
            border-color: #4299e1;
            background: #f8fafc;
            transform: translateX(10px);
            box-shadow: 0 10px 25px rgba(66, 153, 225, 0.15);
        }
        .option:active {
            transform: translateX(5px);
        }
        .option.voted {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            border-color: #38a169;
            color: #22543d;
        }
        .option-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            background: #edf2f7;
            border-radius: 50%;
            margin-right: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #4a5568;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .option:hover .option-index {
            background: #4299e1;
            color: white;
        }
        .option-text {
            flex-grow: 1;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .results-panel {
            margin-top: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 30px;
            color: white;
            display: none;
        }
        .results-panel.show {
            display: block;
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .results-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }
        .results-title::before {
            content: "📊";
            margin-right: 12px;
            font-size: 2rem;
        }
        .chart-item {
            margin: 20px 0;
        }
        .bar-container {
            display: flex;
            align-items: center;
            margin: 12px 0;
        }
        .bar-label {
            width: 150px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .bar-wrapper {
            flex-grow: 1;
            height: 38px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 0 20px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd89b, #19547b);
            border-radius: 10px 0 0 10px;
            width: 0%;
            transition: width 1.5s ease-out;
        }
        .bar-count {
            width: 80px;
            text-align: right;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #a0aec0;
            font-size: 0.9rem;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
            font-size: 1.2rem;
        }
        .alert {
            padding: 20px;
            background: #fed7d7;
            border: 2px solid #fc8181;
            border-radius: 12px;
            color: #c53030;
            margin: 20px 0;
            text-align: center;
            display: none;
        }
        .alert.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="pollTitle">加载投票...</h1>
        <p class="subtitle">点击你支持的选项即可投票，结果将实时更新</p>
        
        <div class="alert" id="alertBox"></div>
        
        <div class="options-container" id="optionsContainer">
            <div class="loading">正在加载选项...</div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="results-title">实时投票结果</div>
            <div id="resultsChart"></div>
        </div>

        <div class="footer">
            <p>⚠️ 提示：系统会自动识别你的设备，确保一人一票。</p>
            <p>分享此链接可邀请更多人参与投票。</p>
        </div>
    </div>

    <script>
        // 从URL获取投票ID
        const urlParams = new URLSearchParams(window.location.search);
        const pollId = urlParams.get('id');
        const apiBase = 'https://vote-api-worker.honeyhj.workers.dev/api';

        // 生成用户唯一标识（简化版，实际应用需更严谨）
        function generateUserId() {
            let userId = localStorage.getItem(`vote_user_${pollId}`);
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem(`vote_user_${pollId}`, userId);
            }
            return userId;
        }
        const userId = generateUserId();

        // 1. 加载投票信息
        async function loadPoll() {
            try {
                const response = await fetch(`${apiBase}/poll/${pollId}`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('pollTitle').textContent = result.data.title;
                    renderOptions(result.data.options);
                } else {
                    showAlert('投票不存在或已被删除');
                }
            } catch (error) {
                console.error('加载投票失败:', error);
                showAlert('加载失败，请检查网络或稍后重试');
            }
        }

        // 2. 渲染选项
        function renderOptions(options) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            options.forEach((optionText, index) => {
                const optionIndex = index + 1;
                const div = document.createElement('div');
                div.className = 'option';
                div.dataset.option = optionIndex;
                div.innerHTML = `
                    <div class="option-index">${optionIndex}</div>
                    <div class="option-text">${optionText}</div>
                `;
                div.onclick = () => castVote(optionIndex, optionText);
                container.appendChild(div);
            });
        }

        // 3. 提交投票
        async function castVote(optionIndex, optionText) {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('show');
            
            try {
                const response = await fetch(`${apiBase}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        poll_id: pollId,
                        user_id: userId,
                        option: optionIndex
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 标记已投票选项
                    document.querySelectorAll('.option').forEach(opt => {
                        opt.classList.remove('voted');
                        if (parseInt(opt.dataset.option) === optionIndex) {
                            opt.classList.add('voted');
                        }
                    });
                    // 显示结果面板并更新
                    document.getElementById('resultsPanel').classList.add('show');
                    loadResults();
                } else {
                    showAlert(result.message || '投票失败');
                }
            } catch (error) {
                console.error('投票失败:', error);
                showAlert('网络错误，请稍后重试');
            }
        }

        // 4. 加载并显示结果
        async function loadResults() {
            try {
                const response = await fetch(`${apiBase}/results?poll_id=${pollId}`);
                const result = await response.json();
                
                if (result.success) {
                    renderResultsChart(result.data);
                }
            } catch (error) {
                console.error('加载结果失败:', error);
            }
        }

        // 5. 渲染结果图表
        function renderResultsChart(data) {
            const container = document.getElementById('resultsChart');
            if (!data || data.length === 0) {
                container.innerHTML = '<p>暂无投票数据</p>';
                return;
            }
            
            // 计算总票数
            const totalVotes = data.reduce((sum, item) => sum + item.count, 0);
            
            let html = '';
            data.forEach(item => {
                const percentage = totalVotes > 0 ? Math.round((item.count / totalVotes) * 100) : 0;
                html += `
                <div class="chart-item">
                    <div class="bar-container">
                        <div class="bar-label">${item.selected_option}号选项</div>
                        <div class="bar-wrapper">
                            <div class="bar-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="bar-count">${item.count} 票 (${percentage}%)</div>
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
            
            // 触发动画
            setTimeout(() => {
                document.querySelectorAll('.bar-fill').forEach(bar => {
                    bar.style.width = bar.style.width;
                });
            }, 100);
        }

        // 工具函数：显示警告
        function showAlert(message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.classList.add('show');
            setTimeout(() => alertBox.classList.remove('show'), 5000);
        }

        // 初始化
        if (!pollId) {
            showAlert('无效的投票链接');
        } else {
            loadPoll();
            // 首次加载时也尝试显示结果
            setTimeout(loadResults, 1000);
        }
    </script>
</body>
</html>
