<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建新投票 - 简易投票系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
        }

        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        .options-container {
            margin-top: 25px;
        }

        .option-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .option-item input {
            flex-grow: 1;
            margin-right: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn:hover {
            background: #cbd5e0;
        }

        .btn-add {
            background: #48bb78;
            color: white;
        }

        .btn-add:hover {
            background: #38a169;
        }

        .btn-remove {
            background: #fc8181;
            color: white;
        }

        .btn-remove:hover {
            background: #f56565;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: #4299e1;
            color: white;
            font-size: 1.1rem;
            margin-top: 30px;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(66, 153, 225, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            background: #f0fff4;
            border: 2px solid #9ae6b4;
            border-radius: 12px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vote-link {
            display: block;
            margin: 15px 0;
            padding: 15px;
            background: #ebf8ff;
            border: 2px dashed #4299e1;
            border-radius: 10px;
            word-break: break-all;
            font-family: monospace;
            font-size: 1rem;
            color: #2b6cb0;
        }

        .copy-btn {
            background: #ed8936;
            color: white;
        }

        .copy-btn:hover {
            background: #dd6b20;
        }

        .instructions {
            background: #fefcbf;
            border-left: 4px solid #d69e2e;
            padding: 15px;
            margin-top: 30px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #744210;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>创建新投票</h1>
        <p class="subtitle">填写下方表单，一键生成属于你自己的投票链接</p>

        <div class="form-group">
            <label for="pollTitle">投票标题 *</label>
            <input type="text" id="pollTitle" placeholder="例如：你最喜欢的编程语言是？" value="你最喜欢的编程语言是？">
        </div>

        <div class="form-group">
            <label>投票选项 *（至少需要2个选项）</label>
            <div class="options-container" id="optionsContainer">
                <!-- 选项会动态添加到这里 -->
            </div>
            <button type="button" class="btn btn-add" id="addOptionBtn">+ 添加选项</button>
        </div>
        <!-- 新增：投票规则配置 -->
        <div class="form-group">
            <label>投票规则配置</label>
            <div style="margin-top:10px; display:flex; flex-direction:column; gap:12px;">
                <label style="display:flex; align-items:center;">
                    <input type="checkbox" id="limitByIp" style="margin-right:8px;">
                    🔒 启用IP限制（防止同一IP重复投票）
                </label>
                <label style="display:flex; align-items:center;">
                    <input type="checkbox" id="allowMultiple" style="margin-right:8px;">
                    ✅ 允许多选（可同时选择多个选项）
                </label>
            </div>
        </div>

        <!-- 在“投票选项”部分之后，添加这个配置区域 -->

        <div class="form-group">

            <label>投票规则配置</label>

            <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">

                <label style="display: flex; align-items: center;">

                    <input type="checkbox" id="limitByIp" style="margin-right: 10px;">

                    🔒 启用IP限制（防止同一IP重复投票）

                </label>

                <label style="display: flex; align-items: center;">

                    <input type="checkbox" id="allowMultiple" style="margin-right: 10px;">

                    ✅ 允许多选（可同时选择多个选项）

                </label>

            </div>

        </div>

        <button class="btn btn-primary" id="createPollBtn">🚀 创建投票</button>

        <div class="result-box" id="resultBox">
            <h3>✅ 投票创建成功！</h3>
            <p>你的投票链接已生成，复制下方链接分享给参与者：</p>
            <input type="text" readonly class="vote-link" id="voteLink">
            <button class="btn copy-btn" id="copyLinkBtn">📋 复制链接</button>
            <p><small>提示：点击链接即可进入投票页面。</small></p>
        </div>

        <div class="instructions">
            <strong>使用说明：</strong><br>
            1. 投票标题和选项为必填项。<br>
            2. 系统将根据浏览器指纹为每位参与者生成唯一标识，防止重复投票。<br>
            3. 创建投票后，请妥善保存生成的链接。
        </div>
    </div>

    <script>
        // --- 页面初始化：默认添加3个选项 ---
        const optionsContainer = document.getElementById('optionsContainer');
        function addOptionInput(value = '') {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerHTML = `
                <input type="text" class="option-input" placeholder="输入选项内容" value="${value}">
                <button type="button" class="btn btn-remove">删除</button>
            `;
            optionsContainer.appendChild(div);
        }
        // 初始化3个默认选项
        addOptionInput('Python');
        addOptionInput('JavaScript');
        addOptionInput('Java');

        // --- 添加选项按钮事件 ---
        document.getElementById('addOptionBtn').addEventListener('click', () => {
            addOptionInput();
        });

        // --- 删除选项按钮事件（事件委托）---
        optionsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-remove')) {
                if (document.querySelectorAll('.option-input').length > 2) {
                    e.target.closest('.option-item').remove();
                } else {
                    alert('至少需要保留2个选项！');
                }
            }
        });

        // --- 创建投票按钮事件（核心）---
        document.getElementById('createPollBtn').addEventListener('click', async () => {
            const title = document.getElementById('pollTitle').value.trim();
            const optionInputs = document.querySelectorAll('.option-input');
            const options = Array.from(optionInputs).map(input => input.value.trim()).filter(v => v);

            // 简单验证
            if (!title) {
                alert('请输入投票标题');
                return;
            }
            if (options.length < 2) {
                alert('请至少填写2个有效选项');
                return;
            }

            // 获取配置
            const limitByIp = document.getElementById('limitByIp').checked;
            const allowMultiple = document.getElementById('allowMultiple').checked;

            // 禁用按钮，防止重复点击
            const btn = document.getElementById('createPollBtn');
            btn.disabled = true;
            btn.textContent = '创建中...';

            try {
                // 获取配置
                const limitByIp = document.getElementById('limitByIp').checked;
                const allowMultiple = document.getElementById('allowMultiple').checked;

                const requestBody = {
                    title: title,
                    options: options,
                    config: {
                        limit_by_ip: limitByIp,
                        allow_multiple: allowMultiple
                    }
                };

                // 调用API
                const response = await fetch('https://vote-api.whmx.top/api/poll', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody) // 使用新的 requestBody
                });

                const result = await response.json();

                if (result.success) {
                    // 生成投票页面的完整链接
                    const pollId = result.poll_id;
                    // 获取当前页面的基础URL（用于构造投票页链接）
                    const baseUrl = window.location.href.replace('/create.html', '');
                    const votePageUrl = `https://whmx.top/vote/poll.html?id=${pollId}`;

                    // 显示成功结果
                    document.getElementById('voteLink').value = votePageUrl;
                    document.getElementById('resultBox').classList.add('show');
                    // 滚动到结果区域
                    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('创建失败：' + (result.error || '未知错误'));
                }
            } catch (error) {
                console.error('API调用错误:', error);
                alert('网络错误，请检查API地址或稍后重试');
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.textContent = '🚀 创建投票';
            }
        });

        // --- 复制链接按钮事件 ---
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const linkInput = document.getElementById('voteLink');
            linkInput.select();
            document.execCommand('copy');
            alert('链接已复制到剪贴板！');
        });
    </script>
</body>

</html>
