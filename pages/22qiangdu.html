<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票 - 懒人躺平攻略</title>
    <!-- 复用主站样式，保持统一风格 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%);
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(16, 36, 54, 0.8);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-left: 4px solid #4a9de3;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4a9de3;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0c8f0;
            margin-bottom: 20px;
        }
        
        .back-btn {
            position: fixed;
            top: 1px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            align-items: center;
            gap: 8px;
            background: rgba(255, 193, 7, 0.288);
            border: 2px solid #ffc107;
            border-radius: 8px;
            color: #fff;
            padding: 4px 10px;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s;
            margin-top: 5px;
            /* 添加响应式确保在手机上也能正常居中 */
            max-width: 90%;
            /* 防止在小屏幕上过宽 */
            box-sizing: border-box;
            /* 确保padding不会增加元素总宽度 */
        }

        .back-btn:hover {
            background: rgba(255, 193, 7, 0.5);
          
        }
        
        .vote-section {
            background: rgba(16, 36, 54, 0.8);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-left: 4px solid #ffd700;
        }
        
        .vote-title {
            color: #ffd700;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        
        .poll-container {
            background: rgba(30, 50, 70, 0.6);
            border-radius: 10px;
            padding: 25px;
            margin: 20px 0;
        }
        
        .instructions {
            text-align: center;
            color: #a0c8f0;
            margin: 25px 0;
            font-style: italic;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #a0c8f0;
            font-size: 0.9rem;
        }

        /* 评论区样式 - 与原版保持一致，使用更宽的容器 */
        .comments-section {
            margin: 40px 0;
            max-width: 1200px; /* 改为和原版一样的宽度 */
            margin-left: auto;
            margin-right: auto;
        }
        
        .section-title {
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        
        .layout-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .vote-section {
                padding: 20px;
            }
            
            .poll-container {
                padding: 15px;
            }
            
            .layout-2col {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "comments"
                    "form";
            }
            
            .comment-card:nth-child(1) {
                grid-area: form;
                order: 2;
            }
            
            .comment-card:nth-child(2) {
                grid-area: comments;
                order: 1;
            }
            
            .comments-list {
                height: 400px;
            }
        }
        
        .comment-card {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid #415a77;
            position: relative;
            overflow: hidden;
        }
        
        .comment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #4cc9f0, #4361ee, transparent);
        }
        
        .card-title {
            color: #e0e1dd;
            margin: 0 0 15px 0;
            font-size: 1.4em;
            text-align: center;
        }
        
        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-label {
            color: #778da9;
            font-size: 0.9em;
        }
        
        .form-input, .form-textarea {
            padding: 12px;
            border: 1px solid #415a77;
            border-radius: 8px;
            background: rgba(13, 27, 42, 0.6);
            color: #e0e1dd;
            font-size: 1em;
        }
        
        .form-textarea {
            height: 120px;
            resize: vertical;
            font-family: inherit;
        }
        
        .submit-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .comments-list {
            height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .comment-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid #4361ee;
            animation: fadeIn 0.3s ease-in;
            position: relative;
        }
        
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8em;
            cursor: pointer;
            display: none;
        }
        
        .delete-mode .delete-btn {
            display: block;
        }
        
        .delete-mode .comment-item {
            border-left-color: #ef4444;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .comment-author {
            color: #4cc9f0;
            font-weight: bold;
        }
        
        .comment-time {
            color: #778da9;
            font-size: 0.8em;
        }
        
        .comment-content {
            color: #e0e1dd;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .loading, .error, .empty {
            text-align: center;
            color: #778da9;
            padding: 40px;
        }
        
        .error {
            color: #f87171;
        }
        
        .update-info {
            text-align: center;
            color: #778da9;
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .admin-panel {
            margin-top: 30px;
        }
        
        .admin-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #415a77;
            border-radius: 6px;
            background: rgba(13,27,42,0.6);
            color: #e0e1dd;
            margin-bottom: 15px;
        }
        
        .admin-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        .login-btn {
            background: #4361ee;
            color: white;
        }
        
        .logout-btn {
            background: #f87171;
            color: white;
        }
        
        .delete-mode-btn {
            background: #f59e0b;
            color: white;
        }
        
        .refresh-btn {
            background: #10b981;
            color: white;
        }
        
        .admin-controls {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💪强度投票</h1>
            <div class="subtitle">发起你得投票，选择你得敌人</div>
            <a href="../index.html" class="back-btn">← 返回攻略主页</a>
        </header>

        <!-- 投票嵌入区域 -->
        <div class="strawpoll-embed" id="strawpoll_bVg8B7V1NyY" style="height: 4192px; max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column;"><iframe title="StrawPoll Embed" id="strawpoll_iframe_bVg8B7V1NyY" src="https://strawpoll.com/embed/bVg8B7V1NyY" style="position: static; visibility: visible; display: block; width: 100%; flex-grow: 1;" frameborder="0" allowfullscreen allowtransparency>Loading...</iframe><script async src="https://cdn.strawpoll.com/dist/widgets.js" charset="utf-8"></script></div>
    </div>

    <!-- 评论区 - 使用独立的宽容器 -->
    <div class="comments-section">
        <h1 class="section-title">💬 玩家讨论区</h1>
        
        <div class="layout-2col">
            <!-- 评论提交表单 -->
            <div class="comment-card">
                <h2 class="card-title">🗣️ 发表评论</h2>
                <form class="comment-form" id="commentForm">

                    <div class="form-group">
                        <label class="form-label">评论内容 *</label>
                        <textarea class="form-textarea" id="content" placeholder="分享您的投票理由或游戏心得..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">
                        📝 发表评论
                    </button>
                </form>
            </div>

            <!-- 评论展示区域 -->
            <div class="comment-card">
                <h2 class="card-title">🔄 评论区</h2>
                <div class="comments-list" id="commentsList">
                    <div class="loading">加载评论中...</div>
                </div>
                <p class="update-info">
                    最后更新: <span id="updateTime"></span>
                </p>
            </div>
        </div>

        <!-- 管理员面板 -->
        <div class="comment-card admin-panel" id="adminPanel">
            <h2 class="card-title">🔧 评论管理</h2>
            <input type="password" class="admin-input" id="adminKey" placeholder="输入管理员密钥">
            <div>
                <button class="admin-btn login-btn" onclick="loginAdmin()">管理员登录</button>
                <button class="admin-btn logout-btn" onclick="logoutAdmin()">退出管理</button>
            </div>
            
            <div class="admin-controls" id="adminControls">
                <h3 style="color: #e0e1dd; margin-bottom: 15px;">管理操作</h3>
                <button class="admin-btn delete-mode-btn" onclick="toggleDeleteMode()">🗑️ 进入删除模式</button>
                <button class="admin-btn refresh-btn" onclick="refreshComments()">🔄 刷新评论</button>
            </div>
        </div>
    </div>

    <div class="container">
        <footer>
            <p>© 2024 懒人躺平攻略 - 玩家投票讨论区</p>
        </footer>
    </div>

     <script>
        // API配置
        const API_BASE = 'https://comments.whmx.top';
        const SITE_ID = 'site3';

        // 状态管理
        const state = {
            lastSubmitTime: 0,
            isAdmin: false,
            adminToken: '',
            deleteMode: false,
            SUBMIT_INTERVAL: 10000 // 10秒间隔
        };

        // 工具函数
        const utils = {
            // 生成随机用户名
            generateRandomUsername() {
                // 形容词列表
                const adjectives = ['快乐的', '神秘的', '勇敢的', '聪明的', '友善的', '活泼的', '安静的', '可爱的', '机智的', '温柔的', '幽默的', '优雅的', '热情的', '冷静的', '耐心的'];
                // 名词列表
                const nouns = ['猫咪', '小狗', '兔子', '熊猫', '老虎', '狮子', '大象', '长颈鹿', '海豚', '企鹅', '小鸟', '蝴蝶', '星星', '月亮', '太阳'];
                // 随机数字
                const randomNum = Math.floor(Math.random() * 9999);
                
                // 随机选择形容词和名词
                const randomAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
                const randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
                
                // 组合成用户名
                return `${randomAdj}${randomNoun}${randomNum}`;
            },
            
            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },



            showAlert(message, type = 'info') {
                // 创建一个自定义的提示框，而不是使用默认的alert
                // 这里为了简化，暂时保留alert，但可以在后续优化为更美观的自定义提示
                alert(message);
            }
        };

        // 评论功能
        const commentManager = {
            async loadComments() {
                try {
                    const commentsList = document.getElementById('commentsList');
                    commentsList.innerHTML = '<div class="loading">加载评论中...</div>';

                    const response = await fetch(`${API_BASE}/comments?site=${SITE_ID}`);
                    if (!response.ok) {
                        throw new Error(`API请求失败: ${response.status} ${response.statusText}`);
                    }

                    let comments;
                    try {
                        comments = await response.json();
                        // 确保返回的数据是数组
                        if (!Array.isArray(comments)) {
                            comments = [];
                        }
                        console.log('从API获取的评论数据:', comments);
                        console.log('评论数量:', comments.length);
                    } catch (jsonError) {
                        console.error('解析评论数据失败:', jsonError);
                        comments = [];
                    }

                    // 检查评论数量，如果超过30条，删除最旧的评论
                    if (comments.length > 30) {
                        // 按ID排序，ID小的是旧评论
                        const sortedComments = [...comments].sort((a, b) => a.id - b.id);
                        // 需要删除的旧评论数量
                        const commentsToDelete = sortedComments.slice(0, comments.length - 30);
                        
                        console.log(`发现 ${comments.length} 条评论，将删除 ${commentsToDelete.length} 条旧评论`);
                        
                        // 尝试删除旧评论（需要管理员权限）
                        if (state.isAdmin && state.adminToken) {
                            let deletedCount = 0;
                            for (const comment of commentsToDelete) {
                                try {
                                    await fetch(`${API_BASE}/admin/delete?site=${SITE_ID}`, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'Authorization': `Bearer ${state.adminToken}`
                                        },
                                        body: JSON.stringify({ commentId: comment.id })
                                    });
                                    deletedCount++;
                                } catch (deleteError) {
                                    console.error(`删除评论 ${comment.id} 失败:`, deleteError);
                                }
                            }
                            console.log(`成功删除 ${deletedCount} 条旧评论`);
                            
                            // 重新获取评论列表，因为我们删除了一些评论
                            const updatedResponse = await fetch(`${API_BASE}/comments?site=${SITE_ID}`);
                            if (updatedResponse.ok) {
                                comments = await updatedResponse.json();
                                if (!Array.isArray(comments)) {
                                    comments = [];
                                }
                            }
                        } else {
                            console.log('没有管理员权限，无法删除旧评论');
                            // 如果没有管理员权限，至少在前端只显示最新的30条
                            comments = [...comments].sort((a, b) => b.id - a.id).slice(0, 30);
                        }
                    }

                    this.displayComments(comments);
                    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');

                } catch (error) {
                    console.error('加载评论失败:', error);
                    document.getElementById('commentsList').innerHTML = `<div class="error">加载评论失败: ${error.message}</div>`;
                }
            },

            displayComments(comments) {
                console.log('准备渲染的评论数据:', comments);
                const commentsList = document.getElementById('commentsList');

                if (!comments || comments.length === 0) {
                    commentsList.innerHTML = '<div class="empty">暂无评论，快来发表第一条吧！</div>';
                    return;
                }
                
                // 过滤并修复不完整的评论数据
                const validComments = comments.filter(comment => comment && typeof comment === 'object');
                console.log('有效评论数量:', validComments.length);

                // 处理删除模式
                if (state.deleteMode) {
                    commentsList.classList.add('delete-mode');
                    // 安全地访问batchControls元素（如果存在）
                    const batchControls = document.getElementById('batchControls');
                    if (batchControls) {
                        batchControls.classList.add('active');
                    }
                } else {
                    commentsList.classList.remove('delete-mode');
                    // 安全地访问batchControls元素（如果存在）
                    const batchControls = document.getElementById('batchControls');
                    if (batchControls) {
                        batchControls.classList.remove('active');
                    }
                }

                // 按ID倒序排列，确保新评论在前面
                const sortedComments = [...validComments].sort((a, b) => b.id - a.id);

                commentsList.innerHTML = sortedComments.map((comment) => {
                    // 确保评论对象有必要的属性
                    const safeUsername = comment.username || '匿名玩家';
                    const safeContent = comment.content || '[内容缺失]';
                    const isSelected = adminManager.selectedComments.includes(comment.id);

                    return `
                <div class="comment-item ${state.deleteMode && isSelected ? 'selected' : ''}">
                    ${state.deleteMode ? `<button class="delete-btn" onclick="commentManager.deleteComment(${comment.id})"></button>` : ''}
                    ${state.deleteMode ? `<input type="checkbox" class="select-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); adminManager.selectComment(${comment.id})"></input>` : ''}
                    <div class="comment-main">
                        <span class="comment-author">${utils.escapeHtml(safeUsername)}</span>
                        <span class="comment-separator">：</span>
                        <span class="comment-content">${utils.escapeHtml(safeContent)}</span>
                    </div>
                </div>
                `;
                }).join('');
            },

            async submitComment(event) {
                event.preventDefault();

                // 10秒间隔检查
                const now = Date.now();
                if (state.lastSubmitTime && (now - state.lastSubmitTime < state.SUBMIT_INTERVAL)) {
                    const waitTime = Math.ceil((state.SUBMIT_INTERVAL - (now - state.lastSubmitTime)) / 1000);
                    utils.showAlert(`请等待 ${waitTime} 秒后再提交评论`);
                    return;
                }

                const content = document.getElementById('content').value.trim();

                // 验证
                if (!content) {
                    utils.showAlert('请输入评论内容');
                    return;
                }

                if (content.length > 500) {
                    utils.showAlert(`评论内容不能超过500字，当前字数：${content.length}`);
                    return;
                }

                // 更新UI状态
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';
                state.lastSubmitTime = now;

                try {
                    const response = await fetch(`${API_BASE}/submit?site=${SITE_ID}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: content,
                            username: utils.generateRandomUsername() // 自动生成随机用户名
                        })
                    });

                    if (!response.ok) {
                        let errorData;
                        try {
                            errorData = await response.json();
                        } catch (jsonError) {
                            throw new Error('服务器响应格式错误');
                        }
                        throw new Error(errorData.error || '提交失败');
                    }

                    // 清空表单
                    document.getElementById('content').value = '';
                    // 安全地设置字符计数（如果元素存在）
                    const charCount = document.getElementById('charCount');
                    if (charCount) {
                        charCount.textContent = '0/500 字';
                        charCount.className = 'char-count';
                    }

                    // 重新加载评论
                    await this.loadComments();

                    // 显示成功
                    submitBtn.textContent = '✅ 发表成功';
                    setTimeout(() => {
                        submitBtn.textContent = '📝 发表评论';
                        submitBtn.disabled = false;
                    }, 2000);

                } catch (error) {
                    console.error('提交评论失败:', error);
                    submitBtn.textContent = '❌ 提交失败';
                    setTimeout(() => {
                        submitBtn.textContent = '📝 发表评论';
                        submitBtn.disabled = false;
                    }, 2000);
                    utils.showAlert('提交失败: ' + error.message);
                    // 只有在网络错误时才重置时间间隔，其他情况保持限制
                    if (error.message.includes('网络') || error.message.includes('fetch')) {
                        state.lastSubmitTime = 0;
                    }
                }
            },

            async deleteComment(commentId) {
                if (!state.isAdmin || !state.adminToken) {
                    utils.showAlert('请先登录管理员');
                    return;
                }

                if (!confirm('确定要删除这条评论吗？此操作不可恢复！')) {
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/admin/delete?site=${SITE_ID}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${state.adminToken}`
                        },
                        body: JSON.stringify({ commentId })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || '删除失败');
                    }

                    utils.showAlert('评论删除成功！');
                    this.loadComments();

                } catch (error) {
                    console.error('删除评论失败:', error);
                    utils.showAlert('删除失败: ' + error.message);
                }
            }
        };

        // 管理员功能
        const adminManager = {
            // 存储选中的评论ID
            selectedComments: [],
            
            async loginAdmin() {
                const key = document.getElementById('adminKey').value.trim();
                if (!key) {
                    utils.showAlert('请输入管理员密钥');
                    return;
                }

                // 显示登录中状态
                const loginBtn = document.querySelector('button[onclick="loginAdmin()"]');
                const originalText = loginBtn.textContent;
                loginBtn.disabled = true;
                loginBtn.textContent = '验证中...';

                try {
                    // 向服务器发送验证请求
                    const response = await fetch(`${API_BASE}/admin/stats?site=${SITE_ID}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${key}`
                        }
                    });

                    if (response.ok) {
                        // 验证成功，设置登录状态
                        state.adminToken = key;
                        state.isAdmin = true;
                        document.getElementById('adminControls').style.display = 'block';
                        document.getElementById('adminKey').value = '';
                        utils.showAlert('管理员登录成功！');
                    } else {
                        // 验证失败
                        utils.showAlert('管理员密钥错误，请重新输入！');
                    }
                } catch (error) {
                    console.error('验证请求失败:', error);
                    utils.showAlert('网络错误，请稍后重试！');
                } finally {
                    // 恢复按钮状态
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                }
            },

            logoutAdmin() {
                state.isAdmin = false;
                state.adminToken = '';
                state.deleteMode = false;
                this.selectedComments = [];
                document.getElementById('adminControls').style.display = 'none';
                document.getElementById('commentsList').classList.remove('delete-mode');
                document.getElementById('batchControls').classList.remove('active');
                commentManager.loadComments();
                utils.showAlert('已退出管理模式');
            },

            toggleDeleteMode() {
                if (!state.isAdmin) {
                    utils.showAlert('请先登录管理员');
                    return;
                }
                


                state.deleteMode = !state.deleteMode;
                commentManager.loadComments();
                utils.showAlert(state.deleteMode ?
                    '删除模式已开启，点击评论右上角的删除按钮即可删除' :
                    '删除模式已关闭');
            },
            

            
            selectComment(commentId) {
                const index = this.selectedComments.indexOf(commentId);
                if (index === -1) {
                    this.selectedComments.push(commentId);
                } else {
                    this.selectedComments.splice(index, 1);
                }
                this.updateSelectedCount();
            },
            
            updateSelectedCount() {
                const selectedCount = document.getElementById('selectedCount');
                const batchInfo = document.getElementById('batchInfo');
                
                selectedCount.textContent = this.selectedComments.length;
                
                if (this.selectedComments.length > 0) {
                    batchInfo.style.color = '#f59e0b';
                } else {
                    batchInfo.style.color = '#778da9';
                }
            },
            
            selectAllComments() {
                if (!state.deleteMode || !state.isAdmin) return;
                
                const commentItems = document.querySelectorAll('.comment-item');
                const allCommentIds = Array.from(commentItems).map(item => {
                    // 从删除按钮的onclick属性中提取评论ID
                    const deleteBtn = item.querySelector('.delete-btn');
                    if (deleteBtn) {
                        const onclickStr = deleteBtn.getAttribute('onclick');
                        const match = onclickStr.match(/deleteComment\((\d+)\)/);
                        if (match) {
                            return parseInt(match[1]);
                        }
                    }
                    return null;
                }).filter(id => id !== null);
                
                this.selectedComments = [...new Set([...this.selectedComments, ...allCommentIds])];
                this.updateSelectedCount();
                
                // 更新UI显示
                commentItems.forEach(item => {
                    const checkbox = item.querySelector('.select-checkbox');
                    if (checkbox) {
                        checkbox.checked = true;
                    }
                    item.classList.add('selected');
                });
                
                utils.showAlert(`已选择全部 ${this.selectedComments.length} 条评论`);
            },
            
            deselectAllComments() {
                if (!state.deleteMode || !state.isAdmin) return;
                
                this.selectedComments = [];
                this.updateSelectedCount();
                
                // 更新UI显示
                const commentItems = document.querySelectorAll('.comment-item');
                commentItems.forEach(item => {
                    const checkbox = item.querySelector('.select-checkbox');
                    if (checkbox) {
                        checkbox.checked = false;
                    }
                    item.classList.remove('selected');
                });
                
                utils.showAlert('已取消所有选择');
            },
            
            async batchDeleteComments() {
                if (!state.isAdmin || !state.adminToken) {
                    utils.showAlert('请先登录管理员');
                    return;
                }
                
                if (this.selectedComments.length === 0) {
                    utils.showAlert('请先选择要删除的评论');
                    return;
                }
                
                if (!confirm(`确定要删除选中的 ${this.selectedComments.length} 条评论吗？此操作不可恢复！`)) {
                    return;
                }
                
                try {
                    // 逐个删除评论
                    let deletedCount = 0;
                    for (const commentId of this.selectedComments) {
                        const response = await fetch(`${API_BASE}/admin/delete?site=${SITE_ID}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${state.adminToken}`
                            },
                            body: JSON.stringify({ commentId })
                        });
                        
                        if (response.ok) {
                            deletedCount++;
                        }
                    }
                    
                    utils.showAlert(`成功删除 ${deletedCount} 条评论！`);
                    
                    // 重置选择状态
                    this.selectedComments = [];
                    this.updateSelectedCount();
                    
                    // 重新加载评论
                    await commentManager.loadComments();
                    
                } catch (error) {
                    console.error('批量删除评论失败:', error);
                    utils.showAlert('批量删除失败: ' + error.message);
                }
            }
        };

        // 初始化
        function init() {
            // 绑定事件
            document.getElementById('commentForm').addEventListener('submit', (e) => commentManager.submitComment(e));

            // 字数统计
            document.getElementById('content').addEventListener('input', function () {
                const count = this.value.length;
                const charCount = document.getElementById('charCount');
                charCount.textContent = `${count}/500 字`;

                if (count > 480) {
                    charCount.className = 'char-count error';
                } else if (count > 400) {
                    charCount.className = 'char-count warning';
                } else {
                    charCount.className = 'char-count';
                }
            });

            // 加载评论
            commentManager.loadComments();

            // 自动刷新
            setInterval(() => commentManager.loadComments(), 30000);
        }

        // 全局函数
        window.loginAdmin = () => adminManager.loginAdmin();
        window.logoutAdmin = () => adminManager.logoutAdmin();
        window.toggleDeleteMode = () => adminManager.toggleDeleteMode();
        window.refreshComments = () => {
            commentManager.loadComments();
            utils.showAlert('评论列表已刷新');
        };

        window.selectAllComments = () => adminManager.selectAllComments();
        window.deselectAllComments = () => adminManager.deselectAllComments();
        window.batchDeleteComments = () => adminManager.batchDeleteComments();

        // 启动
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
