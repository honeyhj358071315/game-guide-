<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票系统 - Game Guide</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-align: center;
        }

        .nav {
            background-color: #333;
            overflow: hidden;
        }

        .nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .nav li {
            margin: 0;
        }

        .nav a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .nav a:hover {
            background-color: #555;
        }

        .hero {
            background-color: #fff;
            padding: 50px 0;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .hero p {
            font-size: 1.1rem;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
        }

        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 30px;
            margin-bottom: 50px;
        }

        .feature {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .feature:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .feature h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #4CAF50;
        }

        .feature p {
            color: #666;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn-secondary {
            background-color: #f44336;
        }

        .btn-secondary:hover {
            background-color: #d32f2f;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid #4CAF50;
            color: #4CAF50;
        }

        .btn-outline:hover {
            background-color: #4CAF50;
            color: white;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .nav ul {
                flex-direction: column;
            }

            .nav a {
                text-align: left;
            }

            .features {
                flex-direction: column;
                align-items: center;
            }

            .feature {
                width: 100%;
                max-width: 500px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Game Guide 投票系统</h1>
        </div>
    </header>

    <nav class="nav">
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="view-vote.html">查看投票</a></li>
            <li><a href="manage-votes.html">管理投票</a></li>
        </ul>
    </nav>

    <div class="container">
        <section class="hero">
            <h2>欢迎使用在线投票系统</h2>
            <p>创建、参与和管理各种投票，与社区分享您的想法和观点。</p>
            <div style="margin-top: 30px;">
                <a href="view-vote.html" class="btn">参与投票</a>
                <a href="manage-votes.html" class="btn btn-outline" style="margin-left: 15px;">管理投票</a>
            </div>
        </section>

        <section class="features">
            <div class="feature">
                <h3>创建投票</h3>
                <p>轻松创建各种类型的投票，支持单选、多选，设置投票限制，自定义投票选项。</p>
                <a href="manage-votes.html" class="btn">立即创建</a>
            </div>

            <div class="feature">
                <h3>参与投票</h3>
                <p>浏览所有可用投票，选择您支持的选项，查看实时投票结果。</p>
                <a href="view-vote.html" class="btn">参与投票</a>
            </div>

            <div class="feature">
                <h3>管理投票</h3>
                <p>查看、编辑和删除您创建的投票，分享投票链接，管理投票权限。</p>
                <a href="manage-votes.html" class="btn">管理投票</a>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Game Guide 投票系统. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
