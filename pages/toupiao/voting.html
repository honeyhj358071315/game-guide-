<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .voting-title {
            font-size: 1.8em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #555;
        }

        .settings {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }

        .settings h2 {
            margin-bottom: 20px;
            color: #495057;
            font-size: 1.3em;
        }

        .setting-item {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .setting-item label {
            margin-left: 10px;
            font-weight: 500;
            color: #495057;
        }

        .vote-type {
            display: flex;
            gap: 20px;
        }

        .vote-options {
            margin-bottom: 30px;
        }

        .option {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .option label {
            font-size: 1.1em;
            color: #333;
            cursor: pointer;
        }

        .vote-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .vote-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .vote-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }

        .results h2 {
            margin-bottom: 20px;
            color: #495057;
            font-size: 1.3em;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .result-bar {
            flex: 1;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            margin: 0 15px;
            overflow: hidden;
        }

        .result-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .notification {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .voting-title {
                font-size: 1.5em;
            }

            .vote-type {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>投票系统</h1>
        
        <div class="notification" id="notification"></div>
        
        <div class="voting-title">你最喜欢的编程语言是什么？</div>
        
        <div class="settings">
            <h2>投票设置</h2>
            
            <div class="setting-item">
                <div class="vote-type">
                    <div>
                        <input type="radio" id="single-select" name="vote-type" value="single" checked>
                        <label for="single-select">单选</label>
                    </div>
                    <div>
                        <input type="radio" id="multi-select" name="vote-type" value="multi">
                        <label for="multi-select">多选</label>
                    </div>
                </div>
            </div>
            
            <div class="setting-item">
                <input type="checkbox" id="daily-limit" name="limits" checked>
                <label for="daily-limit">每天投票限制</label>
            </div>
            
            <div class="setting-item">
                <input type="checkbox" id="ip-limit" name="limits" checked>
                <label for="ip-limit">IP投票限制</label>
            </div>
        </div>
        
        <div class="vote-options">
            <div class="option">
                <input type="radio" name="vote" value="javascript" id="option1" checked>
                <label for="option1">JavaScript</label>
            </div>
            <div class="option">
                <input type="radio" name="vote" value="python" id="option2">
                <label for="option2">Python</label>
            </div>
            <div class="option">
                <input type="radio" name="vote" value="java" id="option3">
                <label for="option3">Java</label>
            </div>
            <div class="option">
                <input type="radio" name="vote" value="csharp" id="option4">
                <label for="option4">C#</label>
            </div>
            <div class="option">
                <input type="radio" name="vote" value="cpp" id="option5">
                <label for="option5">C++</label>
            </div>
        </div>
        
        <button class="vote-btn" id="voteBtn">提交投票</button>
        
        <div class="results">
            <h2>投票结果</h2>
            <div class="result-item">
                <span>JavaScript</span>
                <div class="result-bar">
                    <div class="result-fill" style="width: 40%"></div>
                </div>
                <span id="js-count">40%</span>
            </div>
            <div class="result-item">
                <span>Python</span>
                <div class="result-bar">
                    <div class="result-fill" style="width: 30%"></div>
                </div>
                <span id="py-count">30%</span>
            </div>
            <div class="result-item">
                <span>Java</span>
                <div class="result-bar">
                    <div class="result-fill" style="width: 15%"></div>
                </div>
                <span id="java-count">15%</span>
            </div>
            <div class="result-item">
                <span>C#</span>
                <div class="result-bar">
                    <div class="result-fill" style="width: 10%"></div>
                </div>
                <span id="cs-count">10%</span>
            </div>
            <div class="result-item">
                <span>C++</span>
                <div class="result-bar">
                    <div class="result-fill" style="width: 5%"></div>
                </div>
                <span id="cpp-count">5%</span>
            </div>
        </div>
    </div>

    <script>
        // API配置 - 请根据实际部署情况修改
        // 本地开发：http://localhost:8787
        // Cloudflare Worker: https://your-worker-name.your-subdomain.workers.dev
        const API_BASE_URL = 'http://localhost:8787';
        let currentVoteId = '';
        let voteOptions = [];

        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // 初始化投票表
        async function initVoteTables() {
            try {
                const response = await fetch(`${API_BASE_URL}/init-votes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const result = await response.json();
                if (result.errno === 0) {
                    console.log('投票表初始化成功');
                } else {
                    console.error('投票表初始化失败:', result.errmsg);
                }
            } catch (error) {
                console.error('初始化投票表时出错:', error);
            }
        }

        // 创建新投票
        async function createVote() {
            try {
                const options = ['JavaScript', 'Python', 'Java', 'C#', 'C++'];
                const response = await fetch(`${API_BASE_URL}/votes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: '你最喜欢的编程语言是什么？',
                        description: '请选择你最喜欢的编程语言',
                        options: options,
                        is_multiple: 0,
                        daily_limit: document.getElementById('daily-limit').checked ? 1 : 0,
                        ip_limit: document.getElementById('ip-limit').checked ? 1 : 0
                    })
                });
                const result = await response.json();
                if (result.errno === 0) {
                    currentVoteId = result.data.vote_id;
                    voteOptions = options;
                    console.log('投票创建成功，ID:', currentVoteId);
                } else {
                    console.error('创建投票失败:', result.errmsg);
                }
            } catch (error) {
                console.error('创建投票时出错:', error);
            }
        }

        // 获取投票信息
        async function getVoteInfo(voteId) {
            try {
                const response = await fetch(`${API_BASE_URL}/votes/${voteId}`);
                const result = await response.json();
                if (result.errno === 0) {
                    return result.data;
                } else {
                    console.error('获取投票信息失败:', result.errmsg);
                    return null;
                }
            } catch (error) {
                console.error('获取投票信息时出错:', error);
                return null;
            }
        }

        // 提交投票
        async function submitVote(optionIds) {
            try {
                const response = await fetch(`${API_BASE_URL}/votes/${currentVoteId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        option_ids: optionIds
                    })
                });
                const result = await response.json();
                if (result.errno === 0) {
                    showNotification('投票成功！');
                    updateResults();
                } else {
                    showNotification(result.errmsg, 'error');
                }
            } catch (error) {
                showNotification('投票时出现错误，请稍后重试', 'error');
                console.error('提交投票时出错:', error);
            }
        }

        // 获取投票结果
        async function getVoteResults() {
            try {
                const response = await fetch(`${API_BASE_URL}/votes/${currentVoteId}/results`);
                const result = await response.json();
                if (result.errno === 0) {
                    return result.data;
                } else {
                    console.error('获取投票结果失败:', result.errmsg);
                    return null;
                }
            } catch (error) {
                console.error('获取投票结果时出错:', error);
                return null;
            }
        }

        // 更新投票结果显示
        async function updateResults() {
            const resultsData = await getVoteResults();
            if (!resultsData) return;

            const { results, total } = resultsData;
            const optionValues = ['javascript', 'python', 'java', 'csharp', 'cpp'];
            
            results.forEach((result, index) => {
                const percentage = total > 0 ? Math.round((result.count / total) * 100) : 0;
                const key = optionValues[index];
                const countElement = document.getElementById(key === 'javascript' ? 'js-count' : 
                                       key === 'python' ? 'py-count' : 
                                       key === 'java' ? 'java-count' : 
                                       key === 'csharp' ? 'cs-count' : 'cpp-count');
                const fillElement = document.querySelector(`#${key}-count`).previousElementSibling.querySelector('.result-fill');
                
                if (countElement && fillElement) {
                    countElement.textContent = `${percentage}%`;
                    fillElement.style.width = `${percentage}%`;
                }
            });
        }

        // 处理投票类型切换
        document.querySelectorAll('input[name="vote-type"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const voteType = document.querySelector('input[name="vote-type"]:checked').value;
                const options = document.querySelectorAll('.vote-options input');
                
                options.forEach(option => {
                    if (voteType === 'single') {
                        option.type = 'radio';
                        option.name = 'vote';
                    } else {
                        option.type = 'checkbox';
                        option.name = 'vote[]';
                    }
                });
            });
        });

        // 投票按钮点击事件
        document.getElementById('voteBtn').addEventListener('click', async () => {
            if (!currentVoteId) {
                showNotification('投票未初始化，请刷新页面重试', 'error');
                return;
            }
            
            const voteType = document.querySelector('input[name="vote-type"]:checked').value;
            let selectedOptions = [];
            
            if (voteType === 'single') {
                const selected = document.querySelector('input[name="vote"]:checked');
                if (selected) {
                    const optionValues = ['javascript', 'python', 'java', 'csharp', 'cpp'];
                    const optionIndex = optionValues.indexOf(selected.value);
                    if (optionIndex !== -1) {
                        selectedOptions = [optionIndex];
                    }
                }
            } else {
                const selected = document.querySelectorAll('input[name="vote[]"]:checked');
                const optionValues = ['javascript', 'python', 'java', 'csharp', 'cpp'];
                selectedOptions = Array.from(selected)
                    .map(option => optionValues.indexOf(option.value))
                    .filter(index => index !== -1);
            }
            
            if (selectedOptions.length === 0) {
                showNotification('请至少选择一个选项', 'error');
                return;
            }
            
            await submitVote(selectedOptions);
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            await initVoteTables();
            await createVote();
            await updateResults();
        });
    </script>
</body>
</html>
