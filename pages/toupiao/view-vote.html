<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看投票 - 论坛系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .vote-info {
            margin-bottom: 40px;
        }

        .vote-info h2 {
            font-size: 2em;
            color: #555;
            margin-bottom: 15px;
            text-align: center;
        }

        .vote-info p {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 20px;
        }

        .vote-meta {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 30px;
        }

        .vote-options {
            margin-bottom: 30px;
        }

        .option {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .option label {
            font-size: 1.1em;
            color: #333;
            cursor: pointer;
        }

        .vote-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .vote-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .vote-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }

        .results h2 {
            margin-bottom: 20px;
            color: #495057;
            font-size: 1.3em;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .result-text {
            width: 150px;
            font-weight: 500;
            color: #333;
        }

        .result-bar {
            flex: 1;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            margin: 0 15px;
            overflow: hidden;
        }

        .result-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .result-percentage {
            width: 60px;
            text-align: right;
            font-weight: 500;
            color: #667eea;
        }

        .total-votes {
            text-align: right;
            margin-top: 20px;
            font-weight: 500;
            color: #555;
        }

        .notification {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .share-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .share-section h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .share-url {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .share-url input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
        }

        .share-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .share-btn:hover {
            background: #5a6fd8;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .vote-info h2 {
                font-size: 1.5em;
            }

            .result-text {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="manage-votes.html" class="back-btn">返回投票管理</a>
        
        <h1>查看投票</h1>
        
        <div class="notification" id="notification"></div>
        
        <div class="vote-info">
            <h2 id="vote-title">加载中...</h2>
            <p id="vote-description">加载中...</p>
            <div class="vote-meta" id="vote-meta">加载中...</div>
        </div>
        
        <div class="vote-options" id="vote-options">
            <!-- 投票选项将通过JavaScript动态生成 -->
        </div>
        
        <button class="vote-btn" id="voteBtn">提交投票</button>
        
        <div class="results">
            <h2>投票结果</h2>
            <div id="results-container">
                <!-- 投票结果将通过JavaScript动态生成 -->
            </div>
            <div class="total-votes" id="total-votes">总票数: 0</div>
        </div>
        
        <div class="share-section">
            <h3>分享投票</h3>
            <div class="share-url">
                <input type="text" id="share-url" readonly>
                <button class="share-btn" onclick="copyShareUrl()">复制链接</button>
            </div>
        </div>
    </div>

    <script>
        // API配置 - 请根据实际部署情况修改
        // 本地开发：http://localhost:8787
        // Cloudflare Worker: https://your-worker-name.your-subdomain.workers.dev
        const API_BASE_URL = 'http://localhost:8787';
        let currentVoteId = '';
        let voteData = null;
        
        // 获取URL参数
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split('&');
            for (let i = 0; i < pairs.length; i++) {
                const pair = pairs[i].split('=');
                params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
            }
            return params;
        }
        
        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // 加载投票信息
        async function loadVoteInfo() {
            const params = getUrlParams();
            currentVoteId = params.id;
            
            if (!currentVoteId) {
                showNotification('未找到投票ID', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/votes/${currentVoteId}`);
                const result = await response.json();
                
                if (result.errno === 0) {
                    voteData = result.data;
                    displayVoteInfo();
                    generateShareUrl();
                    updateResults();
                } else {
                    showNotification(result.errmsg, 'error');
                }
            } catch (error) {
                showNotification('加载投票信息时出错，请稍后重试', 'error');
                console.error('加载投票信息时出错:', error);
            }
        }
        
        // 显示投票信息
        function displayVoteInfo() {
            document.getElementById('vote-title').textContent = voteData.title;
            document.getElementById('vote-description').textContent = voteData.description || '无描述';
            document.getElementById('vote-meta').textContent = `创建于: ${new Date(voteData.created).toLocaleString()}`;
            
            const optionsContainer = document.getElementById('vote-options');
            const options = JSON.parse(voteData.options);
            
            optionsContainer.innerHTML = options.map((option, index) => `
                <div class="option">
                    <input type="${voteData.is_multiple ? 'checkbox' : 'radio'}" 
                           id="option-${index}" 
                           name="vote${voteData.is_multiple ? '[]' : ''}" 
                           value="${index}">
                    <label for="option-${index}">${option}</label>
                </div>
            `).join('');
        }
        
        // 生成分享链接
        function generateShareUrl() {
            const shareUrl = `${window.location.origin}/pages/toupiao/view-vote.html?id=${currentVoteId}`;
            document.getElementById('share-url').value = shareUrl;
        }
        
        // 复制分享链接
        function copyShareUrl() {
            const shareUrlInput = document.getElementById('share-url');
            shareUrlInput.select();
            shareUrlInput.setSelectionRange(0, 99999);
            
            navigator.clipboard.writeText(shareUrlInput.value)
                .then(() => {
                    showNotification('分享链接已复制到剪贴板！');
                })
                .catch(() => {
                    showNotification('复制失败，请手动复制链接', 'error');
                });
        }
        
        // 提交投票
        async function submitVote() {
            if (!currentVoteId || !voteData) {
                showNotification('投票未加载完成', 'error');
                return;
            }
            
            const selectedOptions = document.querySelectorAll('input[name^="vote"]:checked');
            if (selectedOptions.length === 0) {
                showNotification('请至少选择一个选项', 'error');
                return;
            }
            
            const optionIds = Array.from(selectedOptions).map(option => parseInt(option.value));
            
            try {
                const response = await fetch(`${API_BASE_URL}/votes/${currentVoteId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        option_ids: optionIds
                    })
                });
                
                const result = await response.json();
                if (result.errno === 0) {
                    showNotification('投票成功！');
                    updateResults();
                    // 禁用投票按钮
                    document.getElementById('voteBtn').disabled = true;
                    document.getElementById('voteBtn').textContent = '已投票';
                } else {
                    showNotification(result.errmsg, 'error');
                }
            } catch (error) {
                showNotification('投票时出现错误，请稍后重试', 'error');
                console.error('提交投票时出错:', error);
            }
        }
        
        // 获取投票结果
        async function getVoteResults() {
            try {
                const response = await fetch(`${API_BASE_URL}/votes/${currentVoteId}/results`);
                const result = await response.json();
                return result.errno === 0 ? result.data : null;
            } catch (error) {
                console.error('获取投票结果时出错:', error);
                return null;
            }
        }
        
        // 更新投票结果显示
        async function updateResults() {
            const resultsData = await getVoteResults();
            if (!resultsData) return;
            
            const { results, total } = resultsData;
            const options = JSON.parse(voteData.options);
            const resultsContainer = document.getElementById('results-container');
            
            resultsContainer.innerHTML = results.map((result, index) => {
                const percentage = total > 0 ? Math.round((result.count / total) * 100) : 0;
                return `
                    <div class="result-item">
                        <div class="result-text">${options[index]}</div>
                        <div class="result-bar">
                            <div class="result-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="result-percentage">${percentage}%</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('total-votes').textContent = `总票数: ${total}`;
        }
        
        // 投票按钮点击事件
        document.getElementById('voteBtn').addEventListener('click', submitVote);
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', loadVoteInfo);
    </script>
</body>
</html>
