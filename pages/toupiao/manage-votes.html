<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票管理 - 论坛系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5em;
        }

        .nav-tabs {
            display: flex;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 30px;
        }

        .nav-tab {
            padding: 15px 30px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 500;
            color: #6c757d;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .nav-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .options-container {
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .option-item input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .settings {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .settings h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .setting-item {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .setting-item label {
            margin-left: 10px;
            font-weight: 500;
            color: #495057;
        }

        .votes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .vote-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .vote-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.1);
        }

        .vote-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .vote-card p {
            margin-bottom: 15px;
            color: #666;
            font-size: 0.9em;
        }

        .vote-actions {
            display: flex;
            gap: 10px;
        }

        .notification {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .nav-tabs {
                flex-direction: column;
            }

            .nav-tab {
                border-bottom: none;
                border-left: 3px solid transparent;
            }

            .nav-tab.active {
                border-bottom: none;
                border-left-color: #667eea;
            }

            .votes-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>投票管理系统</h1>
        
        <div class="notification" id="notification"></div>
        
        <div class="nav-tabs">
            <div class="nav-tab active" data-tab="create-vote">创建投票</div>
            <div class="nav-tab" data-tab="manage-votes">管理投票</div>
        </div>
        
        <!-- 创建投票选项卡 -->
        <div class="tab-content active" id="create-vote">
            <div class="form-group">
                <label for="vote-title">投票标题</label>
                <input type="text" id="vote-title" placeholder="请输入投票标题">
            </div>
            
            <div class="form-group">
                <label for="vote-description">投票描述</label>
                <textarea id="vote-description" placeholder="请输入投票描述（可选）"></textarea>
            </div>
            
            <div class="options-container">
                <label>投票选项</label>
                <div class="option-item">
                    <input type="text" placeholder="选项 1" required>
                    <button class="btn btn-danger" onclick="removeOption(this)">删除</button>
                </div>
                <div class="option-item">
                    <input type="text" placeholder="选项 2" required>
                    <button class="btn btn-danger" onclick="removeOption(this)">删除</button>
                </div>
            </div>
            
            <button class="btn btn-secondary" onclick="addOption()" style="margin-bottom: 20px;">添加选项</button>
            
            <div class="settings">
                <h3>投票设置</h3>
                
                <div class="setting-item">
                    <input type="radio" id="single-select" name="vote-type" value="single" checked>
                    <label for="single-select">单选</label>
                </div>
                
                <div class="setting-item">
                    <input type="radio" id="multi-select" name="vote-type" value="multi">
                    <label for="multi-select">多选</label>
                </div>
                
                <div class="setting-item">
                    <input type="checkbox" id="ip-limit">
                    <label for="ip-limit">IP限制（每个IP只能投票一次）</label>
                </div>
                
                <div class="setting-item">
                    <input type="checkbox" id="daily-limit">
                    <label for="daily-limit">每日限制（每个IP每天只能投票一次）</label>
                </div>
            </div>
            
            <input type="hidden" id="vote-id">
            <div style="display: flex; gap: 10px;">
                <button id="create-vote-btn" class="btn btn-primary" onclick="createVote()">创建投票</button>
                <button class="btn btn-secondary" onclick="resetForm()">重置</button>
            </div>
        </div>
        
        <!-- 管理投票选项卡 -->
        <div class="tab-content" id="manage-votes">
            <h2>我的投票</h2>
            <div class="votes-list" id="votes-list">
                <!-- 投票列表将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // API配置 - 请根据实际部署情况修改
        // 本地开发：http://localhost:8787
        // Cloudflare Worker: https://your-worker-name.your-subdomain.workers.dev
        const API_BASE_URL = 'http://localhost:8787';
        
        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // 切换选项卡
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 移除所有活动状态
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // 添加当前活动状态
                tab.classList.add('active');
                const tabId = tab.dataset.tab;
                document.getElementById(tabId).classList.add('active');
                
                // 如果切换到管理投票选项卡，加载投票列表
                if (tabId === 'manage-votes') {
                    loadVotesList();
                }
            });
        });
        
        // 添加选项
        function addOption() {
            const optionsContainer = document.querySelector('.options-container');
            const optionCount = optionsContainer.querySelectorAll('.option-item').length + 1;
            
            const optionItem = document.createElement('div');
            optionItem.className = 'option-item';
            optionItem.innerHTML = `
                <input type="text" placeholder="选项 ${optionCount}" required>
                <button class="btn btn-danger" onclick="removeOption(this)">删除</button>
            `;
            
            optionsContainer.appendChild(optionItem);
        }
        
        // 删除选项
        function removeOption(button) {
            const optionItem = button.parentElement;
            const optionsContainer = optionItem.parentElement;
            const options = optionsContainer.querySelectorAll('.option-item');
            
            // 确保至少保留2个选项
            if (options.length > 2) {
                optionItem.remove();
                
                // 更新选项编号
                optionsContainer.querySelectorAll('.option-item input').forEach((input, index) => {
                    input.placeholder = `选项 ${index + 1}`;
                });
            } else {
                showNotification('至少需要2个选项', 'error');
            }
        }
        
        // 重置表单
        function resetForm() {
            document.getElementById('vote-title').value = '';
            document.getElementById('vote-description').value = '';
            document.getElementById('ip-limit').checked = false;
            document.getElementById('daily-limit').checked = false;
            document.getElementById('single-select').checked = true;
            document.getElementById('vote-id').value = '';
            document.getElementById('create-vote-btn').textContent = '创建投票';
            
            // 重置选项
            const optionsContainer = document.querySelector('.options-container');
            const existingOptions = optionsContainer.querySelectorAll('.option-item');
            existingOptions.forEach(option => option.remove());
            
            // 重新添加两个空选项
            for (let i = 0; i < 2; i++) {
                const optionItem = document.createElement('div');
                optionItem.className = 'option-item';
                optionItem.innerHTML = `
                    <input type="text" placeholder="选项 ${i + 1}" required>
                    <button class="btn btn-danger" onclick="removeOption(this)">删除</button>
                `;
                optionsContainer.appendChild(optionItem);
            }
        }
        
        // 创建或更新投票
        async function createVote() {
            const voteId = document.getElementById('vote-id').value;
            const title = document.getElementById('vote-title').value.trim();
            const description = document.getElementById('vote-description').value.trim();
            const optionsInputs = document.querySelectorAll('.options-container input');
            const options = Array.from(optionsInputs).map(input => input.value.trim()).filter(value => value);
            const voteType = document.querySelector('input[name="vote-type"]:checked').value;
            const ipLimit = document.getElementById('ip-limit').checked ? 1 : 0;
            const dailyLimit = document.getElementById('daily-limit').checked ? 1 : 0;
            
            // 验证表单
            if (!title) {
                showNotification('请输入投票标题', 'error');
                return;
            }
            
            if (options.length < 2) {
                showNotification('至少需要2个有效选项', 'error');
                return;
            }
            
            // 获取创建/更新按钮并设置加载状态
            const createBtn = document.querySelector('button[onclick="createVote()"]');
            const originalText = createBtn.textContent;
            createBtn.textContent = voteId ? '更新中...' : '创建中...';
            createBtn.disabled = true;
            
            try {
                // 检查API_BASE_URL配置
                if (!API_BASE_URL || API_BASE_URL.includes('your-cloudflare-worker-url')) {
                    showNotification('API配置错误：请先配置正确的API地址', 'error');
                    return;
                }
                
                const url = voteId ? `${API_BASE_URL}/votes/${voteId}` : `${API_BASE_URL}/votes`;
                const method = voteId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        description,
                        options,
                        is_multiple: voteType === 'multi' ? 1 : 0,
                        daily_limit: dailyLimit,
                        ip_limit: ipLimit
                    })
                });
                
                const result = await response.json();
                if (result.errno === 0) {
                    showNotification(voteId ? '投票更新成功！' : '投票创建成功！');
                    resetForm();
                    loadVotesList(); // 刷新投票列表
                } else {
                    showNotification(result.errmsg, 'error');
                }
            } catch (error) {
                let errorMessage = (voteId ? '更新' : '创建') + '投票时出错：';
                
                // 根据不同错误类型提供更具体的提示
                if (error.message.includes('Failed to fetch')) {
                    errorMessage += `无法连接到API服务器。请检查：\n1. API地址是否正确（当前：${API_BASE_URL}）\n2. 服务器是否正在运行\n3. 网络连接是否正常`;
                } else {
                    errorMessage += error.message;
                }
                
                showNotification(errorMessage, 'error');
                console.error((voteId ? '更新' : '创建') + '投票时出错:', error);
            } finally {
                // 恢复按钮状态
                createBtn.textContent = originalText;
                createBtn.disabled = false;
            }
        }
        
        // 加载投票列表
        async function loadVotesList() {
            const votesList = document.getElementById('votes-list');
            votesList.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #666;">加载中...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/votes`);
                const result = await response.json();
                
                if (result.errno === 0) {
                    const votes = result.data;
                    
                    if (votes.length === 0) {
                        votesList.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #666;">暂无投票</p>';
                        return;
                    }
                    
                    votesList.innerHTML = votes.map(vote => `
                        <div class="vote-card">
                            <h3>${vote.title}</h3>
                            <p>${vote.description || '无描述'}</p>
                            <p>创建于: ${new Date(vote.created).toLocaleString()}</p>
                            <div class="vote-actions">
                                <button class="btn btn-primary" onclick="viewVote('${vote.id}')">查看</button>
                                <button class="btn btn-secondary" onclick="editVote('${vote.id}')">编辑</button>
                                <button class="btn btn-danger" onclick="deleteVote('${vote.id}')">删除</button>
                                <button class="btn btn-secondary" onclick="shareVote('${vote.id}')">分享</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    votesList.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #dc3545;">加载失败</p>';
                    console.error('加载投票列表失败:', result.errmsg);
                }
            } catch (error) {
                votesList.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #dc3545;">加载失败</p>';
                console.error('加载投票列表时出错:', error);
            }
        }
        
        // 查看投票
        function viewVote(voteId) {
            window.location.href = `view-vote.html?id=${voteId}`;
        }
        
        // 删除投票
        async function deleteVote(voteId) {
            if (confirm('确定要删除这个投票吗？此操作不可恢复。')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/votes/${voteId}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    if (result.errno === 0) {
                        showNotification('投票删除成功！');
                        loadVotesList();
                    } else {
                        showNotification(result.errmsg, 'error');
                    }
                } catch (error) {
                    showNotification('删除投票时出错，请稍后重试', 'error');
                    console.error('删除投票时出错:', error);
                }
            }
        }
        
        // 编辑投票
        async function editVote(voteId) {
            try {
                const response = await fetch(`${API_BASE_URL}/votes/${voteId}`);
                const result = await response.json();
                
                if (result.errno === 0) {
                    const vote = result.data;
                    
                    // 切换到创建投票选项卡
                    document.querySelector('.nav-tab[data-tab="create-vote"]').click();
                    
                    // 填充表单
                    document.getElementById('vote-title').value = vote.title;
                    document.getElementById('vote-description').value = vote.description;
                    document.querySelector(`input[name="vote-type"][value="${vote.is_multiple ? 'multi' : 'single'}"]`).checked = true;
                    document.getElementById('ip-limit').checked = vote.ip_limit;
                    document.getElementById('daily-limit').checked = vote.daily_limit;
                    
                    // 清空现有选项
                    const optionsContainer = document.querySelector('.options-container');
                    const existingOptions = optionsContainer.querySelectorAll('.option-item');
                    existingOptions.forEach(option => option.remove());
                    
                    // 添加现有选项
                    const options = JSON.parse(vote.options);
                    options.forEach((option, index) => {
                        const optionItem = document.createElement('div');
                        optionItem.className = 'option-item';
                        optionItem.innerHTML = `
                            <input type="text" value="${option}" placeholder="选项 ${index + 1}" required>
                            <button class="btn btn-danger" onclick="removeOption(this)">删除</button>
                        `;
                        optionsContainer.appendChild(optionItem);
                    });
                    
                    // 设置当前编辑的投票ID
                    document.getElementById('vote-id').value = voteId;
                    document.getElementById('create-vote-btn').textContent = '更新投票';
                } else {
                    showNotification('加载投票信息失败: ' + result.errmsg, 'error');
                }
            } catch (error) {
                showNotification('加载投票信息失败: ' + error.message, 'error');
                console.error('加载投票信息失败:', error);
            }
        }
        
        // 分享投票
        function shareVote(voteId) {
            const shareUrl = `${window.location.origin}/pages/toupiao/view-vote.html?id=${voteId}`;
            navigator.clipboard.writeText(shareUrl)
                .then(() => {
                    showNotification('分享链接已复制到剪贴板！');
                })
                .catch(() => {
                    // 降级方案
                    prompt('请复制分享链接:', shareUrl);
                });
        }
    </script>
</body>
</html>
