<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家讨论区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1c;
            color: #e0e1dd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部导航区域 - 居中 */
        .top-nav {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        /* 大标题样式 */
        .main-title {
            font-size: 3em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #4cc9f0, #4361ee, #7209b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        /* 返回按钮样式 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }

        .comments-section {
            margin: 40px 0;
        }

        .layout-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .layout-2col {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .main-title {
                font-size: 2.2em;
            }
        }

        .comment-card {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid #415a77;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .comment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #4cc9f0, #4361ee, transparent);
        }

        .card-title {
            color: #e0e1dd;
            margin: 0 0 20px 0;
            font-size: 1.5em;
            text-align: center;
            font-weight: 600;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            color: #778da9;
            font-size: 0.9em;
            font-weight: 500;
        }

        .form-input,
        .form-textarea {
            padding: 10px 12px;
            border: 1px solid #415a77;
            border-radius: 8px;
            background: rgba(13, 27, 42, 0.8);
            color: #e0e1dd;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #4cc9f0;
            box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
        }

        .form-textarea {
            height: 120px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
        }

        .char-count {
            text-align: right;
            color: #778da9;
            font-size: 0.8em;
            margin-top: 4px;
        }

        .char-count.warning {
            color: #f59e0b;
        }

        .char-count.error {
            color: #f87171;
            font-weight: bold;
        }

        .submit-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .comments-list {
            height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 5px;
        }

        .comments-list::-webkit-scrollbar {
            width: 6px;
        }

        .comments-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .comments-list::-webkit-scrollbar-thumb {
            background: #4361ee;
            border-radius: 3px;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 15px;
            border-left: 4px solid #4361ee;
            animation: fadeIn 0.3s ease-in;
            position: relative;
            transition: all 0.3s ease;
        }

        .comment-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.7em;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .delete-mode .delete-btn {
            display: block;
        }

        .delete-mode .comment-item {
            border-left-color: #ef4444;
        }

        /* 删除模式全选复选框 */
        .delete-mode .select-checkbox {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            display: block;
        }

        .delete-mode .comment-item.selected {
            background: rgba(239, 68, 68, 0.15);
            border-left-color: #ef4444;
        }

        .delete-mode .comment-main {
            padding-left: 26px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comment-main {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.5;
        }

        .batch-select-mode .comment-main {
            padding-left: 26px;
        }

        .comment-time {
            color: #4a5568;
            font-size: 0.75em;
            margin-top: 0;
        }

        .comment-separator {
            color: #778da9;
            font-size: 0.85em;
        }

        .comment-author {
            color: #4cc9f0;
            font-weight: bold;
            font-size: 0.85em;
        }

        .comment-time {
            color: #778da9;
            font-size: 0.8em;
        }

        .comment-content {
            color: #e0e1dd;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            white-space: normal;
            max-width: 100%;
            font-size: 0.95em;
            flex: 1;
        }

        .comment-main {
            word-break: break-word;
            overflow: hidden;
            width: 100%;
        }

        .loading,
        .error,
        .empty {
            text-align: center;
            color: #778da9;
            padding: 40px;
            font-size: 1.1em;
        }

        .error {
            color: #f87171;
        }

        .empty {
            color: #778da9;
            font-style: italic;
        }

        .update-info {
            text-align: center;
            color: #778da9;
            margin-top: 15px;
            font-size: 0.9em;
            padding: 10px;
            border-top: 1px solid #415a77;
        }

        .admin-panel {
            margin-top: 30px;
        }

        .admin-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #415a77;
            border-radius: 8px;
            background: rgba(13, 27, 42, 0.8);
            color: #e0e1dd;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .admin-input:focus {
            outline: none;
            border-color: #4cc9f0;
            box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
        }

        .admin-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            transform: translateY(-2px);
        }

        .login-btn {
            background: #4361ee;
            color: white;
        }

        .login-btn:hover {
            background: #3a56d4;
        }

        .logout-btn {
            background: #f87171;
            color: white;
        }

        .logout-btn:hover {
            background: #ef4444;
        }

        .delete-mode-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-mode-btn:hover {
            background: #e6900b;
        }

        .batch-delete-btn {
            background: #ef4444;
            color: white;
        }

        .batch-delete-btn:hover {
            background: #dc2626;
        }

        .refresh-btn {
            background: #10b981;
            color: white;
        }

        .refresh-btn:hover {
            background: #0da271;
        }

        .admin-controls {
            margin-top: 20px;
            display: none;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid #415a77;
        }

        .admin-controls h3 {
            color: #e0e1dd;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-align: center;
        }

        .batch-controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #415a77;
            display: none;
        }

        .batch-controls.active {
            display: block;
        }

        .batch-info {
            color: #778da9;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-status {
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .admin-status.authenticated {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .admin-status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #f87171;
        }

        /* 公告栏样式 */
        .announcement-bar {
            margin-bottom: 30px;
        }

        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .announcement-content {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #f59e0b;
            min-height: 60px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }

        .announcement-editor {
            margin-top: 15px;
        }

        .announcement-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .edit-announcement-btn {
            background: #f59e0b;
            color: white;
        }

        .edit-announcement-btn:hover {
            background: #e6900b;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 顶部导航区域 - 居中 -->
        <div class="top-nav">
            <!-- 大标题 -->
            <h1 class="main-title">意见与建议</h1>
            <!-- 返回按钮 -->
            <a href="../index.html" class="back-btn">
                ← 返回导航首页
            </a>
        </div>

        <div class="comments-section">
            <!-- 公告栏 -->
            <div class="comment-card announcement-bar">
                <div class="announcement-header">
                    <h2 class="card-title">📢 公告栏</h2>
                    <button class="admin-btn edit-announcement-btn" onclick="toggleAnnouncementEdit()" style="display: none;">编辑公告</button>
                </div>
                <div class="announcement-content" id="announcementContent" style="display: block;"> 1.由于个人工作和技术原因，更新会较为缓慢，当期重要内容会优先更新，次要内容则会慢更                              2025/11/5 </div>
                </div>
                <div class="announcement-editor" style="display: none;">
                    <textarea class="form-textarea" id="announcementTextarea" placeholder="编辑" rows="4"></textarea>
                    <div class="announcement-actions">
                        <button class="admin-btn login-btn" onclick="saveAnnouncement()">保存公告</button>
                        <button class="admin-btn logout-btn" onclick="cancelAnnouncementEdit()">取消</button>
                    </div>
                </div>
            </div>

            <div class="layout-2col">
                <!-- 评论提交表单 -->
                <div class="comment-card">
                    <h2 class="card-title">🗣️ 发表评论</h2>
                    <form class="comment-form" id="commentForm">
                        <div class="form-group">
                            <label class="form-label">评论内容 *</label>
                            <textarea class="form-textarea" id="content" placeholder="分享您的游戏心得与建议..." required
                                maxlength="500"></textarea>
                            <div class="char-count" id="charCount">0/500 字</div>
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtn">
                            📝 发表评论
                        </button>
                    </form>
                </div>

                <!-- 评论展示区域 -->
                <div class="comment-card">
                    <h2 class="card-title">🔄 玩家反馈</h2>
                    <div class="comments-list" id="commentsList">
                        <div class="loading">加载评论中...</div>
                    </div>
                    <p class="update-info">
                        最后更新: <span id="updateTime">--</span>
                    </p>
                </div>
            </div>

            <!-- 管理员面板 -->
            <div class="comment-card admin-panel" id="adminPanel">
                <h2 class="card-title">🔧 评论管理</h2>
                <input type="password" class="admin-input" id="adminKey" placeholder="输入管理员密钥">
                <div>
                    <button class="admin-btn login-btn" onclick="loginAdmin()">管理员登录</button>
                    <button class="admin-btn logout-btn" onclick="logoutAdmin()">退出管理</button>
                </div>

                <!-- 管理员状态显示 -->
                <div class="admin-status" id="adminStatus" style="display: none;"></div>

                <div class="admin-controls" id="adminControls">
                    <h3>管理操作</h3>
                    <button class="admin-btn delete-mode-btn" onclick="toggleDeleteMode()">🗑️ 进入删除模式</button>
                    <button class="admin-btn refresh-btn" onclick="refreshComments()">🔄 刷新评论</button>

                    <!-- 批量操作控制区域 -->
                    <div class="batch-controls" id="batchControls">
                        <div class="batch-info" id="batchInfo">已选择 <span id="selectedCount">0</span> 条评论</div>
                        <div class="batch-actions">
                            <button class="admin-btn" onclick="selectAllComments()">全选</button>
                            <button class="admin-btn" onclick="deselectAllComments()">取消全选</button>
                            <button class="admin-btn batch-delete-btn" onclick="batchDeleteComments()">批量删除选中</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 公告栏功能
        function loadAnnouncement() {
            // 直接从HTML元素加载公告（已经在页面中渲染）
            const announcementContent = document.getElementById('announcementContent');
            // 如果内容为空，显示默认提示
            if (!announcementContent.textContent.trim() || announcementContent.textContent.trim() === '暂无公告') {
                announcementContent.innerHTML = '<p>暂无公告</p>';
            }
        }

        function toggleAnnouncementEdit() {
            const announcementContent = document.getElementById('announcementContent');
            const announcementEditor = document.querySelector('.announcement-editor');
            const announcementTextarea = document.getElementById('announcementTextarea');
            
            // 如果是管理员已登录
            if (isAdminLoggedIn()) {
                // 从HTML元素中获取当前公告内容（移除HTML标签）
                const currentContent = announcementContent.textContent === '暂无公告' ? '' : announcementContent.textContent;
                announcementTextarea.value = currentContent;
                
                // 切换显示状态
                announcementContent.style.display = 'none';
                announcementEditor.style.display = 'block';
            } else {
                alert('请先以管理员身份登录');
            }
        }

        function saveAnnouncement() {
            const announcementTextarea = document.getElementById('announcementTextarea');
            const announcement = announcementTextarea.value.trim();
            
            // 直接更新HTML元素内容（不再使用localStorage）
            const announcementContent = document.getElementById('announcementContent');
            const announcementEditor = document.querySelector('.announcement-editor');
            
            if (announcement) {
                announcementContent.innerHTML = announcement.replace(/\n/g, '<br>');
            } else {
                announcementContent.innerHTML = '<p>暂无公告</p>';
            }
            
            // 隐藏编辑界面
            announcementContent.style.display = 'block';
            announcementEditor.style.display = 'none';
            
            alert('公告保存成功');
        }

        function cancelAnnouncementEdit() {
            const announcementContent = document.getElementById('announcementContent');
            const announcementEditor = document.querySelector('.announcement-editor');
            
            // 取消编辑，恢复显示
            announcementContent.style.display = 'block';
            announcementEditor.style.display = 'none';
        }

        // 检查管理员登录状态的函数
        function isAdminLoggedIn() {
            return state.isAdmin;
        }

        // 更新编辑按钮显示状态
        function updateAnnouncementEditButton() {
            const editButton = document.querySelector('.edit-announcement-btn');
            editButton.style.display = isAdminLoggedIn() ? 'inline-block' : 'none';
        }

        // 在页面加载时初始化公告栏
        document.addEventListener('DOMContentLoaded', function() {
            loadAnnouncement();
            updateAnnouncementEditButton();
        });

        // API配置
        const API_BASE = 'https://comments.whmx.top';
        const SITE_ID = 'site1';

        // 状态管理
        const state = {
            lastSubmitTime: 0,
            isAdmin: false,
            adminToken: '',
            deleteMode: false,
            SUBMIT_INTERVAL: 10000 // 10秒间隔
        };

        // 工具函数
        const utils = {
            // 生成随机用户名
            generateRandomUsername() {
                // 形容词列表
                const adjectives = ['快乐的', '神秘的', '勇敢的', '聪明的', '友善的', '活泼的', '安静的', '可爱的', '机智的', '温柔的', '幽默的', '优雅的', '热情的', '冷静的', '耐心的'];
                // 名词列表
                const nouns = ['猫咪', '小狗', '兔子', '熊猫', '老虎', '狮子', '大象', '长颈鹿', '海豚', '企鹅', '小鸟', '蝴蝶', '星星', '月亮', '太阳'];
                // 随机数字
                const randomNum = Math.floor(Math.random() * 9999);
                
                // 随机选择形容词和名词
                const randomAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
                const randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
                
                // 组合成用户名
                return `${randomAdj}${randomNoun}${randomNum}`;
            },
            
            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },



            showAlert(message, type = 'info') {
                // 创建一个自定义的提示框，而不是使用默认的alert
                // 这里为了简化，暂时保留alert，但可以在后续优化为更美观的自定义提示
                alert(message);
            }
        };

        // 评论功能
        const commentManager = {
            async loadComments() {
                try {
                    const commentsList = document.getElementById('commentsList');
                    commentsList.innerHTML = '<div class="loading">加载评论中...</div>';

                    const response = await fetch(`${API_BASE}/comments?site=${SITE_ID}`);
                    if (!response.ok) {
                        throw new Error(`API请求失败: ${response.status} ${response.statusText}`);
                    }

                    let comments;
                    try {
                        comments = await response.json();
                        // 确保返回的数据是数组
                        if (!Array.isArray(comments)) {
                            comments = [];
                        }
                    } catch (jsonError) {
                        console.error('解析评论数据失败:', jsonError);
                        comments = [];
                    }

                    // 检查评论数量，如果超过30条，删除最旧的评论
                    if (comments.length > 30) {
                        // 按ID排序，ID小的是旧评论
                        const sortedComments = [...comments].sort((a, b) => a.id - b.id);
                        // 需要删除的旧评论数量
                        const commentsToDelete = sortedComments.slice(0, comments.length - 30);
                        
                        console.log(`发现 ${comments.length} 条评论，将删除 ${commentsToDelete.length} 条旧评论`);
                        
                        // 尝试删除旧评论（需要管理员权限）
                        if (state.isAdmin && state.adminToken) {
                            let deletedCount = 0;
                            for (const comment of commentsToDelete) {
                                try {
                                    await fetch(`${API_BASE}/admin/delete?site=${SITE_ID}`, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'Authorization': `Bearer ${state.adminToken}`
                                        },
                                        body: JSON.stringify({ commentId: comment.id })
                                    });
                                    deletedCount++;
                                } catch (deleteError) {
                                    console.error(`删除评论 ${comment.id} 失败:`, deleteError);
                                }
                            }
                            console.log(`成功删除 ${deletedCount} 条旧评论`);
                            
                            // 重新获取评论列表，因为我们删除了一些评论
                            const updatedResponse = await fetch(`${API_BASE}/comments?site=${SITE_ID}`);
                            if (updatedResponse.ok) {
                                comments = await updatedResponse.json();
                                if (!Array.isArray(comments)) {
                                    comments = [];
                                }
                            }
                        } else {
                            console.log('没有管理员权限，无法删除旧评论');
                            // 如果没有管理员权限，至少在前端只显示最新的30条
                            comments = [...comments].sort((a, b) => b.id - a.id).slice(0, 30);
                        }
                    }

                    this.displayComments(comments);
                    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');

                } catch (error) {
                    console.error('加载评论失败:', error);
                    document.getElementById('commentsList').innerHTML = `<div class="error">加载评论失败: ${error.message}</div>`;
                }
            },

            displayComments(comments) {
                const commentsList = document.getElementById('commentsList');

                if (!comments || comments.length === 0) {
                    commentsList.innerHTML = '<div class="empty">暂无评论，快来发表第一条吧！</div>';
                    return;
                }

                // 处理删除模式
                if (state.deleteMode) {
                    commentsList.classList.add('delete-mode');
                    document.getElementById('batchControls').classList.add('active');
                } else {
                    commentsList.classList.remove('delete-mode');
                    document.getElementById('batchControls').classList.remove('active');
                }

                // 按ID倒序排列，确保新评论在前面
                const sortedComments = [...comments].sort((a, b) => b.id - a.id);

                commentsList.innerHTML = sortedComments.map((comment) => {
                    const isSelected = adminManager.selectedComments.includes(comment.id);

                    return `
                <div class="comment-item ${state.deleteMode && isSelected ? 'selected' : ''}">
                    ${state.deleteMode ? `<button class="delete-btn" onclick="commentManager.deleteComment(${comment.id})"></button>` : ''}
                    ${state.deleteMode ? `<input type="checkbox" class="select-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); adminManager.selectComment(${comment.id})"></input>` : ''}
                    <div class="comment-main">
                        <span class="comment-author">${utils.escapeHtml(comment.username || '匿名玩家')}</span>
                        <span class="comment-separator">：</span>
                        <span class="comment-content">${utils.escapeHtml(comment.content)}</span>
                    </div>
                </div>
                `;
                }).join('');
            },

            async submitComment(event) {
                event.preventDefault();

                // 10秒间隔检查
                const now = Date.now();
                if (state.lastSubmitTime && (now - state.lastSubmitTime < state.SUBMIT_INTERVAL)) {
                    const waitTime = Math.ceil((state.SUBMIT_INTERVAL - (now - state.lastSubmitTime)) / 1000);
                    utils.showAlert(`请等待 ${waitTime} 秒后再提交评论`);
                    return;
                }

                const content = document.getElementById('content').value.trim();

                // 验证
                if (!content) {
                    utils.showAlert('请输入评论内容');
                    return;
                }

                if (content.length > 500) {
                    utils.showAlert(`评论内容不能超过500字，当前字数：${content.length}`);
                    return;
                }

                // 更新UI状态
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';
                state.lastSubmitTime = now;

                try {
                    const response = await fetch(`${API_BASE}/submit?site=${SITE_ID}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: content,
                            username: utils.generateRandomUsername() // 使用随机用户名
                        })
                    });

                    if (!response.ok) {
                        let errorData;
                        try {
                            errorData = await response.json();
                        } catch (jsonError) {
                            throw new Error('服务器响应格式错误');
                        }
                        throw new Error(errorData.error || '提交失败');
                    }

                    // 清空表单
                    document.getElementById('content').value = '';
                    document.getElementById('charCount').textContent = '0/500 字';
                    document.getElementById('charCount').className = 'char-count';

                    // 重新加载评论
                    await this.loadComments();

                    // 显示成功
                    submitBtn.textContent = '✅ 发表成功';
                    setTimeout(() => {
                        submitBtn.textContent = '📝 发表评论';
                        submitBtn.disabled = false;
                    }, 2000);

                } catch (error) {
                    console.error('提交评论失败:', error);
                    submitBtn.textContent = '❌ 提交失败';
                    setTimeout(() => {
                        submitBtn.textContent = '📝 发表评论';
                        submitBtn.disabled = false;
                    }, 2000);
                    utils.showAlert('提交失败: ' + error.message);
                    // 只有在网络错误时才重置时间间隔，其他情况保持限制
                    if (error.message.includes('网络') || error.message.includes('fetch')) {
                        state.lastSubmitTime = 0;
                    }
                }
            },

            async deleteComment(commentId) {
                if (!state.isAdmin || !state.adminToken) {
                    utils.showAlert('请先登录管理员');
                    return;
                }

                if (!confirm('确定要删除这条评论吗？此操作不可恢复！')) {
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/admin/delete?site=${SITE_ID}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${state.adminToken}`
                        },
                        body: JSON.stringify({ commentId })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || '删除失败');
                    }

                    utils.showAlert('评论删除成功！');
                    this.loadComments();

                } catch (error) {
                    console.error('删除评论失败:', error);
                    utils.showAlert('删除失败: ' + error.message);
                }
            }
        };

        // 管理员功能
        const adminManager = {
            // 存储选中的评论ID
            selectedComments: [],
            
            async loginAdmin() {
                const key = document.getElementById('adminKey').value.trim();
                if (!key) {
                    utils.showAlert('请输入管理员密钥');
                    return;
                }

                // 显示登录中状态
                const loginBtn = document.querySelector('button[onclick="loginAdmin()"]');
                const originalText = loginBtn.textContent;
                loginBtn.disabled = true;
                loginBtn.textContent = '验证中...';

                try {
                    // 向服务器发送验证请求
                    const response = await fetch(`${API_BASE}/admin/stats?site=${SITE_ID}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${key}`
                        }
                    });

                    if (response.ok) {
                        // 验证成功，设置登录状态
                        state.adminToken = key;
                        state.isAdmin = true;
                        document.getElementById('adminControls').style.display = 'block';
                        document.getElementById('adminKey').value = '';
                        // 更新公告编辑按钮显示状态
                        updateAnnouncementEditButton();
                        utils.showAlert('管理员登录成功！');
                    } else {
                        // 验证失败
                        utils.showAlert('管理员密钥错误，请重新输入！');
                    }
                } catch (error) {
                    console.error('验证请求失败:', error);
                    utils.showAlert('网络错误，请稍后重试！');
                } finally {
                    // 恢复按钮状态
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                }
            },

            logoutAdmin() {
                state.isAdmin = false;
                state.adminToken = '';
                state.deleteMode = false;
                this.selectedComments = [];
                document.getElementById('adminControls').style.display = 'none';
                document.getElementById('commentsList').classList.remove('delete-mode');
                document.getElementById('batchControls').classList.remove('active');
                // 更新公告编辑按钮显示状态
                updateAnnouncementEditButton();
                commentManager.loadComments();
                utils.showAlert('已退出管理模式');
            },

            toggleDeleteMode() {
                if (!state.isAdmin) {
                    utils.showAlert('请先登录管理员');
                    return;
                }
                


                state.deleteMode = !state.deleteMode;
                commentManager.loadComments();
                utils.showAlert(state.deleteMode ?
                    '删除模式已开启，点击评论右上角的删除按钮即可删除' :
                    '删除模式已关闭');
            },
            

            
            selectComment(commentId) {
                const index = this.selectedComments.indexOf(commentId);
                if (index === -1) {
                    this.selectedComments.push(commentId);
                } else {
                    this.selectedComments.splice(index, 1);
                }
                this.updateSelectedCount();
            },
            
            updateSelectedCount() {
                const selectedCount = document.getElementById('selectedCount');
                const batchInfo = document.getElementById('batchInfo');
                
                selectedCount.textContent = this.selectedComments.length;
                
                if (this.selectedComments.length > 0) {
                    batchInfo.style.color = '#f59e0b';
                } else {
                    batchInfo.style.color = '#778da9';
                }
            },
            
            selectAllComments() {
                if (!state.deleteMode || !state.isAdmin) return;
                
                const commentItems = document.querySelectorAll('.comment-item');
                const allCommentIds = Array.from(commentItems).map(item => {
                    // 从删除按钮的onclick属性中提取评论ID
                    const deleteBtn = item.querySelector('.delete-btn');
                    if (deleteBtn) {
                        const onclickStr = deleteBtn.getAttribute('onclick');
                        const match = onclickStr.match(/deleteComment\((\d+)\)/);
                        if (match) {
                            return parseInt(match[1]);
                        }
                    }
                    return null;
                }).filter(id => id !== null);
                
                this.selectedComments = [...new Set([...this.selectedComments, ...allCommentIds])];
                this.updateSelectedCount();
                
                // 更新UI显示
                commentItems.forEach(item => {
                    const checkbox = item.querySelector('.select-checkbox');
                    if (checkbox) {
                        checkbox.checked = true;
                    }
                    item.classList.add('selected');
                });
                
                utils.showAlert(`已选择全部 ${this.selectedComments.length} 条评论`);
            },
            
            deselectAllComments() {
                if (!state.deleteMode || !state.isAdmin) return;
                
                this.selectedComments = [];
                this.updateSelectedCount();
                
                // 更新UI显示
                const commentItems = document.querySelectorAll('.comment-item');
                commentItems.forEach(item => {
                    const checkbox = item.querySelector('.select-checkbox');
                    if (checkbox) {
                        checkbox.checked = false;
                    }
                    item.classList.remove('selected');
                });
                
                utils.showAlert('已取消所有选择');
            },
            
            async batchDeleteComments() {
                if (!state.isAdmin || !state.adminToken) {
                    utils.showAlert('请先登录管理员');
                    return;
                }
                
                if (this.selectedComments.length === 0) {
                    utils.showAlert('请先选择要删除的评论');
                    return;
                }
                
                if (!confirm(`确定要删除选中的 ${this.selectedComments.length} 条评论吗？此操作不可恢复！`)) {
                    return;
                }
                
                try {
                    // 逐个删除评论
                    let deletedCount = 0;
                    for (const commentId of this.selectedComments) {
                        const response = await fetch(`${API_BASE}/admin/delete?site=${SITE_ID}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${state.adminToken}`
                            },
                            body: JSON.stringify({ commentId })
                        });
                        
                        if (response.ok) {
                            deletedCount++;
                        }
                    }
                    
                    utils.showAlert(`成功删除 ${deletedCount} 条评论！`);
                    
                    // 重置选择状态
                    this.selectedComments = [];
                    this.updateSelectedCount();
                    
                    // 重新加载评论
                    await commentManager.loadComments();
                    
                } catch (error) {
                    console.error('批量删除评论失败:', error);
                    utils.showAlert('批量删除失败: ' + error.message);
                }
            }
        };

        // 初始化
        function init() {
            // 绑定事件
            document.getElementById('commentForm').addEventListener('submit', (e) => commentManager.submitComment(e));

            // 字数统计
            document.getElementById('content').addEventListener('input', function () {
                const count = this.value.length;
                const charCount = document.getElementById('charCount');
                charCount.textContent = `${count}/500 字`;

                if (count > 480) {
                    charCount.className = 'char-count error';
                } else if (count > 400) {
                    charCount.className = 'char-count warning';
                } else {
                    charCount.className = 'char-count';
                }
            });

            // 加载评论
            commentManager.loadComments();

            // 自动刷新
            setInterval(() => commentManager.loadComments(), 30000);
        }

        // 全局函数
        window.loginAdmin = () => adminManager.loginAdmin();
        window.logoutAdmin = () => adminManager.logoutAdmin();
        window.toggleDeleteMode = () => adminManager.toggleDeleteMode();
        window.refreshComments = () => {
            commentManager.loadComments();
            utils.showAlert('评论列表已刷新');
        };

        window.selectAllComments = () => adminManager.selectAllComments();
        window.deselectAllComments = () => adminManager.deselectAllComments();
        window.batchDeleteComments = () => adminManager.batchDeleteComments();

        // 启动
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
